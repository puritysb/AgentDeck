version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      compatible-development:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: cargo
    directory: /shared/glance-raster
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directories: [/bridge/python, /esp32/robot]
    schedule:
      interval: weekly
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
