version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Routine version updates have a review budget; security PRs have their
    # separate GitHub limit and are not disabled by this setting.
    open-pull-requests-limit: 2
    groups:
      compatible-development:
        applies-to: version-updates
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      compatible-actions:
        applies-to: version-updates
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /shared/glance-raster
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
  - package-ecosystem: pip
    directories: [/bridge/python, /esp32/robot]
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
