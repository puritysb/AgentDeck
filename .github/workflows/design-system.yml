name: Design System

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    name: Token sync + lint regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      # pnpm BEFORE setup-node, because `cache: pnpm` needs the binary to exist
      # when the cache key is computed. The "Verify ESP32 board table" step below
      # builds @agentdeck/shared, so this job needs the workspace installed —
      # without it that step exits 127 (`pnpm: command not found`), which is a
      # gate that never checks anything while still failing the branch.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.5.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Token mirrors must match design/tokens.css — drift here is always a bug.
      - name: Verify token mirrors are in sync
        run: python3 design/verify-tokens-sync.py

      # Self-test exercises the verifier itself against five gap patterns
      # (var-swap, group-misplace, stray-numeric, hex-stray, comment-mask).
      # If any pattern slips through, the verifier itself has regressed.
      - name: Self-test verifier gap detection
        run: python3 design/verify-tokens-sync.py --self-test

      - name: Verify design-system catalog, frontmatter, and translations
        run: node scripts/build-design-system-viewer.mjs --check

      - name: Verify Markdown links, anchors, and heading structure
        run: node scripts/check-docs.mjs

      # The development log is one file per entry (docs/devlog/entries/); nothing
      # generated from it is committed. A malformed entry fails here; entry links are
      # validated by the Markdown check.
      - name: Verify development-log entries are well-formed
        run: node scripts/devlog-build.mjs --check

      # The ESP32 board set is written out in four places and only one edge had
      # a gate. A board missing from the release matrix ships no firmware and
      # nothing else fails — which is how three boards had no binaries at 1.0.1.
      - name: Verify ESP32 board table
        run: |
          pnpm --filter @agentdeck/shared build
          node scripts/generate-esp32-board-matrix.mjs --check

      # The Pages GNB is single-sourced from scripts/pages-nav.html; the four
      # committed surfaces must match the rendered partial (Build Health
      # renders it at generation time and cannot drift).
      - name: Verify Pages GNB parity
        run: node scripts/sync-pages-nav.mjs --check

      # The Devices page renders the ESP32 spec cards from the compatibility
      # matrix. The Markdown table is the SSOT; the cards must not drift.
      - name: Verify ESP32 spec-card parity
        run: node scripts/sync-hardware-spec-cards.mjs --check

      # The landing page repeats the matrix's surface count in three places
      # (headline, stat tile, chip grid). Adding a matrix row without its chip
      # is how the page came to claim 26 surfaces over 22 chips.
      - name: Verify public surface-count mirrors
        run: node scripts/check-surface-mirrors.mjs

      # lint.sh is baseline-aware. The current count must be ≤ the snapshot
      # recorded in docs/design-lint-baseline.md. Lower is welcome (no action);
      # higher fails the PR with a delta report.
      # Counts tracked files only, so a built local checkout and this unbuilt
      # runner give the same number (scripts/check-design-lint-baseline.mjs).
      - name: Lint vs baseline
        run: node scripts/check-design-lint-baseline.mjs
