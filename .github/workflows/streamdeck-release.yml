name: Stream Deck Release

on:
  push:
    tags:
      - 'streamdeck-v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Verify release version
        run: |
          VERSION="${GITHUB_REF_NAME#streamdeck-v}"
          node scripts/verify-release-version.mjs streamdeck "$VERSION"
          node scripts/verify-version-sync.mjs

      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#streamdeck-v}" >> "$GITHUB_OUTPUT"

      # Runs Elgato's official validator then packs. `streamdeck validate` is
      # the same gate the Marketplace applies on upload, so a failure here is a
      # submission that would have been rejected.
      - name: Package plugin
        run: pnpm package

      - name: Render release notes
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "AgentDeck Stream Deck v${{ steps.version.outputs.VERSION }}"
          body_path: notes.md
          files: dist/bound.serendipity.agentdeck.streamDeckPlugin

      - name: Upload packaged plugin artifact
        uses: actions/upload-artifact@v7
        with:
          name: streamdeck-plugin-v${{ steps.version.outputs.VERSION }}
          path: dist/bound.serendipity.agentdeck.streamDeckPlugin
