name: npm Release

on:
  push:
    tags:
      - 'npm-v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify release version
        run: |
          VERSION="${GITHUB_REF_NAME#npm-v}"
          node scripts/verify-release-version.mjs npm "$VERSION"
          node scripts/verify-version-sync.mjs

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.5.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      # npm trusted publishing requires npm >=11.5.1. Pin the major/minor tool
      # independently from Node so a GitHub runner image cannot silently fall
      # back to the token-only npm bundled with an older Node 22 patch.
      - name: Install OIDC-capable npm
        run: npm install --global npm@11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#npm-v}" >> "$GITHUB_OUTPUT"

      # npmjs.com trusts this exact GitHub Actions workflow through OIDC. There
      # is deliberately no enable variable or long-lived publish token: an
      # npm-v* tag is a delivery request, so a missing trust relationship must
      # fail red rather than skip green.
      #
      # scripts/publish-npm.mjs owns the dependency order (shared+hooks before
      # bridge's exact pins) AND the workspace:* rewrite. It publishes with npm
      # from each package directory, not `pnpm publish`, because pnpm (11.5.2)
      # does not attach README.md to the registry packument — which left every
      # @agentdeck npm page blank until 1.0.15.
      - name: Publish packages
        run: node scripts/publish-npm.mjs

      - name: Verify packages on npm registry
        run: |
          VERSION="${GITHUB_REF_NAME#npm-v}"
          for PACKAGE in shared hooks bridge setup; do
            ACTUAL=$(npm view "@agentdeck/${PACKAGE}@${VERSION}" version)
            test "$ACTUAL" = "$VERSION"
          done

      - name: Render release notes
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: 'AgentDeck npm v${{ steps.version.outputs.VERSION }}'
          body_path: notes.md
