name: Apple Tests

on:
  push:
    branches: [master]
    paths:
      - 'apple/**'
      - 'shared/**'
      - 'bridge/assets/fonts/**'
      - 'bridge/src/glance-frame.ts'
      - 'scripts/generate-glance-policy.mjs'
      - 'generated/protocol/**'
      - 'docs/appstore-metadata-draft.md'
      - '.github/workflows/apple-test.yml'
  pull_request:
    branches: [master]
    paths:
      - 'apple/**'
      - 'shared/**'
      - 'bridge/assets/fonts/**'
      - 'bridge/src/glance-frame.ts'
      - 'scripts/generate-glance-policy.mjs'
      - 'generated/protocol/**'
      - 'docs/appstore-metadata-draft.md'
      - '.github/workflows/apple-test.yml'

# Explicit bash enables -o pipefail; xcbeautify must not hide xcodebuild failures.
defaults:
  run:
    shell: bash

# Only newer commits on the same PR supersede a run. Master, scheduled and
# explicitly dispatched runs retain independent execution and audit history.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Gates the App Store submission bundle (metadata field limits per locale,
  # screenshot/preview dimensions, privacy manifest, encryption declaration).
  # Without this the metadata draft can drift out of ASC's limits — or out of
  # the shape the validator parses — and only fail at submission time.
  validate-submission:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install ffmpeg (App Preview probing)
        run: brew install ffmpeg

      - name: Validate App Store submission bundle
        run: bash apple/scripts/validate-appstore-submission.sh

  test-macos:
    # The app and test host require macOS 26; an older SDK host can build
    # the target but cannot execute its tests.
    runs-on: macos-26
    # Cold universal optimized builds can finish XCTest just as 30m expires.
    # Keep every check; allow the preview job enough time for test/cleanup.
    timeout-minutes: ${{ matrix.configuration == 'DotPreviewRelease' && 45 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - configuration: Debug
            dot: excluded
            action: test
          - configuration: Release
            dot: excluded
            action: build
          - configuration: DotPreviewRelease
            dot: preview
            action: test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@7dcc700092a1a8b9c17ba0e140b4e34e93000946 # 1.90.0
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Using: $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"

      - name: Typecheck generated Swift reference models
        if: matrix.configuration == 'Debug'
        run: |
          for source in generated/protocol/*.swift; do
            swiftc -typecheck "$source"
          done

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Regenerate Xcode project
        working-directory: apple
        run: xcodegen generate

      - name: Build AgentDeck_macOS
        run: |
          xcodebuild build \
            -project apple/AgentDeck.xcodeproj \
            -scheme AgentDeck_macOS \
            -configuration '${{ matrix.configuration }}' \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/AgentDeckDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions || exit 1

      - name: Run AgentDeckTests_macOS
        if: matrix.action == 'test'
        run: |
          xcodebuild test \
            -project apple/AgentDeck.xcodeproj \
            -scheme AgentDeck_macOS \
            -configuration '${{ matrix.configuration }}' \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/AgentDeckDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath "$RUNNER_TEMP/AgentDeckTests.xcresult" \
            | xcbeautify --renderer github-actions || exit 1

      - name: Verify compiled Dot boundary
        run: python3 apple/scripts/verify-dot-build.py "$RUNNER_TEMP/AgentDeckDerivedData/Build/Products/${{ matrix.configuration }}/AgentDeck.app" '${{ matrix.dot }}'

      - name: Verify CloudKit transport and remote monitoring without iCloud access
        if: matrix.configuration == 'Debug'
        env:
          AGENTDECK_APPLE_DERIVED_DATA: ${{ runner.temp }}/AgentDeckCloudKitDerivedData
        run: bash apple/scripts/verify-build.sh macOS CloudKitPoCDebug

      - name: Upload xcresult on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AgentDeckTests-${{ matrix.configuration }}-xcresult
          path: ${{ runner.temp }}/AgentDeckTests.xcresult

  build-ios:
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - configuration: Release
            dot: excluded
          - configuration: DotPreviewRelease
            dot: preview

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Regenerate Xcode project
        working-directory: apple
        run: xcodegen generate

      - name: Build AgentDeck_iOS (unsigned)
        run: |
          xcodebuild build \
            -project apple/AgentDeck.xcodeproj \
            -scheme AgentDeck_iOS \
            -configuration '${{ matrix.configuration }}' \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/AgentDeckDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions || exit 1

      - name: Verify compiled Dot boundary
        run: python3 apple/scripts/verify-dot-build.py "$RUNNER_TEMP/AgentDeckDerivedData/Build/Products/${{ matrix.configuration }}-iphonesimulator/AgentDeck.app" '${{ matrix.dot }}'

      - name: Build CloudKit PoC companion without signing
        if: matrix.configuration == 'Release'
        env:
          AGENTDECK_APPLE_DERIVED_DATA: ${{ runner.temp }}/AgentDeckCloudKitDerivedData
        run: bash apple/scripts/verify-build.sh iOS CloudKitPoCDebug

      - name: Build development Watch app and embedded complications
        if: matrix.configuration == 'Release'
        env:
          AGENTDECK_APPLE_DERIVED_DATA: ${{ runner.temp }}/AgentDeckWatchDerivedData
        run: bash apple/scripts/verify-build.sh watchOS CloudKitPoCDebug

      - name: Test companion onboarding layouts
        if: matrix.configuration == 'Release'
        run: |
          SIMULATOR_ID=$(xcrun simctl list devices available --json | python3 -c 'import json, sys; print(next(d["udid"] for ds in json.load(sys.stdin)["devices"].values() for d in ds if d["name"].startswith("iPhone")))')
          xcodebuild test \
            -project apple/AgentDeck.xcodeproj \
            -scheme AgentDeck_iOS \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/AgentDeckDerivedData" \
            -only-testing:AgentDeckTests_iOS/CompanionOnboardingLayoutTests \
            -only-testing:AgentDeckTests_iOS/OnboardingPreferenceTests \
            -only-testing:AgentDeckTests_iOS/OnboardingIntegrationTests \
            -only-testing:AgentDeckTests_iOS/ConnectionOverlayTests \
            -only-testing:AgentDeckTests_iOS/ForegroundSearchBoundTests \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath "$RUNNER_TEMP/CompanionOnboarding.xcresult" \
            | xcbeautify --renderer github-actions

      - name: Upload companion layout results
        if: always() && matrix.configuration == 'Release'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CompanionOnboarding-xcresult
          path: ${{ runner.temp }}/CompanionOnboarding.xcresult
