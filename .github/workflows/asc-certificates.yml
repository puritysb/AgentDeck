# App Store Connect certificate maintenance (manual dispatch only).
#
# Cloud signing creates certificates on demand and Apple caps how many an
# account may hold; when the cap is reached, `xcodebuild -allowProvisioningUpdates`
# fails the archive with "Choose a certificate to revoke". Freeing it is an
# account action that needs the ASC API key — which lives here as a release
# secret, not on anyone's laptop. Hence this workflow: it runs the maintenance
# where the credential already is, so the key never leaves the runner.
#
# Always run `list` first and read the output. `revoke` takes explicit ids only
# — there is deliberately no "revoke everything expired" mode, because a
# distribution certificate revoked by accident invalidates shipped signing
# assets.
name: ASC Certificates

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Certificates, store status, or guarded macOS release"
        required: true
        default: list
        type: choice
        options: [list, revoke, store-status, release-prepare, release-submit]
      certificate_ids:
        description: "Comma-separated certificate ids (revoke only)"
        required: false
        type: string
      release_version:
        description: "Exact macOS version with prepared repository copy (release actions only)"
        required: false
        type: string
      release_build:
        description: "Exact uploaded macOS build (release actions only)"
        required: false
        type: string

      release_run:
        description: "Successful Apple upload CI run ID from this exact source commit"
        required: false
        type: string

permissions:
  contents: read
  actions: read

# A lost response must be read back, never handled by overlapping dispatches.
concurrency:
  group: asc-agentdeck-maintenance
  cancel-in-progress: false

jobs:
  certificates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run bounded App Store Connect operation
        env:
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
          ASC_ACTION: ${{ inputs.action }}
          ASC_CERTIFICATE_IDS: ${{ inputs.certificate_ids }}
          ASC_RELEASE_VERSION: ${{ inputs.release_version }}
          ASC_RELEASE_BUILD: ${{ inputs.release_build }}
          ASC_RELEASE_RUN: ${{ inputs.release_run }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          case "$ASC_ACTION" in
            revoke)
              node scripts/asc-certificates.mjs revoke "$ASC_CERTIFICATE_IDS"
              ;;
            release-prepare|release-submit)
              node scripts/asc-certificates.mjs "$ASC_ACTION" "$ASC_RELEASE_VERSION" "$ASC_RELEASE_BUILD" "$ASC_RELEASE_RUN"
              ;;
            list|store-status)
              node scripts/asc-certificates.mjs "$ASC_ACTION"
              ;;
            *) exit 2 ;;
          esac
