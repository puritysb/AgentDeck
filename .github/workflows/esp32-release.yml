name: ESP32 Release

on:
  push:
    tags:
      - 'esp32-v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: true
      max-parallel: 1  # sequential — one board at a time to avoid resource conflicts
      matrix:
        # One entry per board this repository builds firmware for, i.e. every
        # row marked Shipping in the ESP32 board table of
        # docs/hardware-compatibility.md. A Shipping board missing here has no
        # downloadable firmware at all, which is how t_embed, t_display_pro and
        # esp32_c6_147 were absent from the 1.0.1 release set.
        #
        # `board` is the canonical device id — the string the firmware reports
        # as `device_info.board` and the one `agentdeck esp32-ota <target>`
        # resolves to (SSOT: ESP32_OTA_BOARDS in bridge/src/cli.ts). `env` is
        # the PlatformIO environment. They are deliberately different
        # namespaces, so assets are named by the canonical id: the file you
        # download is then literally the target you pass to the OTA command.
        board:
          # ESP32-BOARDS:BEGIN (generated from shared/src/esp32-boards.ts by scripts/generate-esp32-board-matrix.mjs — do not edit by hand)
          - { env: box_86, board: 86box, name: '86 Box', display: '4" 480x480 ST7701', ota: 'yes' }
          - { env: ips35, board: ips_35, name: 'IPS 3.5"', display: '3.5" 480x320 AXS15231B', ota: 'yes' }
          - { env: amoled, board: round_amoled, name: 'Round AMOLED', display: '1.8" 360x360 ST77916', ota: 'yes' }
          - { env: ips10, board: ips_10, name: 'IPS 10.1"', display: '10.1" 800x1280 JD9365', ota: 'yes' }
          - { env: inkdeck, board: inkdeck, name: 'InkDeck', display: '7.5" 800x480 e-ink UC8179', ota: 'yes' }
          - { env: nm_epd_420, board: nm_epd_420, name: 'RockBase NM-EPD-420', display: '4.2" 400x300 tri-color e-ink GDEY042Z98', ota: 'no' }
          - { env: lilygo_epd47, board: lilygo_epd47, name: 'LilyGo T5 ePaper S3', display: '4.7" 960x540 grayscale e-ink ED047TC2', ota: 'yes' }
          - { env: ttgo, board: ttgo_t_display, name: 'TTGO T-Display', display: '1.14" 240x135 ST7789', ota: 'yes' }
          - { env: led8x32, board: ulanzi_tc001, name: 'Ulanzi TC001', display: '32x8 WS2812B matrix', ota: 'yes' }
          - { env: t_embed, board: t_embed, name: 'T-Embed CC1101', display: '1.9" 320x170 ST7789', ota: 'yes' }
          - { env: t_display_pro, board: t_display_pro, name: 'T-Display-S3-Pro', display: '2.33" 480x222 ST7796U', ota: 'yes' }
          - { env: esp32_c6_147, board: esp32_c6_147, name: 'Waveshare C6-LCD-1.47', display: '1.47" 172x320 ST7789', ota: 'no' }
          # ESP32-BOARDS:END

    steps:
      - uses: actions/checkout@v4

      - name: Verify release version
        run: |
          VERSION="${GITHUB_REF_NAME#esp32-v}"
          node scripts/verify-release-version.mjs esp32 "$VERSION"
          node scripts/verify-version-sync.mjs

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The merged image and the manifest are driven by shared/src/esp32-boards.ts,
      # so the shared package has to be built before either script runs.
      - name: Build shared (board SSOT)
        run: |
          pnpm install --frozen-lockfile --filter @agentdeck/shared...
          pnpm --filter @agentdeck/shared build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Pinned for the same reason esptool is, and it broke the same way: a
      # routine upstream release breaks a firmware cut AT TAG TIME, when the
      # tag is already pushed. PlatformIO 6.2.0 (PyPI, 2026-09-05) requires
      # `platformio/tool-scons @ ~4.41101.0` (SCons 4.11.1) while the
      # pioarduino ESP32 platform pins its own `tool-scons` 4.8.1 — the build
      # installs BOTH and links against the mixture, which no longer carries
      # `SCons.Tool.FortranCommon`. Every board fails at the firmware.elf link
      # step; `esp32-v1.2.2` died there two days after `esp32-v1.2.1` (PlatformIO
      # 6.1.19 + SCons 4.8.1) had passed on the same source.
      #
      # TAKE THIS NUMBER FROM PyPI AND FROM A GREEN RUN, never from a local
      # `pio --version`: a dev machine's ~/.platformio/penv is whatever it
      # first installed and keeps working long after CI has moved on — which
      # is exactly why this cut built locally and failed in CI.
      #
      # 6.1.19 is measured: it is what run 33819354649 (`esp32-v1.2.1`,
      # 2026-09-03) installed alongside SCons 4.8.1 for all ten boards.
      - name: Install PlatformIO
        run: pip install "platformio==6.1.19"

      # Pinned deliberately. esptool renamed its subcommands between v4 and v5
      # (`merge_bin`/`--flash_size` -> `merge-bin`/`--flash-size`); un-pinned, a
      # routine upstream release breaks a firmware cut at tag time, when the
      # tag is already pushed.
      #
      # TAKE THIS NUMBER FROM PyPI, NEVER FROM A LOCAL `pip show esptool`.
      # PlatformIO vendors its own esptool as the `tool-esptoolpy` package and
      # installs it EDITABLE into ~/.platformio/penv, so a dev machine answers
      # `pip show esptool` -> 5.1.2 for a version PyPI has never published (its
      # 5.1 line stops at 5.1.0). That is where the previous pin came from, and
      # it failed the only way it could: at tag time, on `esp32-v1.0.7`, with
      # "No matching distribution found for esptool==5.1.2" — the exact failure
      # the pin exists to prevent, caused by the pin. Two registries, one name.
      #
      # 5.2.0 is measured, not remembered: on 2026-08-22 it merged and passed
      # esp32-merge-firmware.mjs's header read-back for all four chip families
      # in this fleet and all three bootloader offsets — 86box/inkdeck/
      # t_display_pro (S3, 0x0), ttgo_t_display/ulanzi_tc001 (ESP32, 0x1000),
      # ips_10 (P4, 0x2000), esp32_c6_147 (C6, 0x0).
      - name: Install esptool
        run: pip install "esptool==5.2.0"

      - name: Build ${{ matrix.board.name }}
        run: |
          cd esp32
          pio run -e ${{ matrix.board.env }}

      - name: Collect firmware
        run: |
          set -euo pipefail
          mkdir -p dist
          ENV='${{ matrix.board.env }}'
          BOARD='${{ matrix.board.board }}'
          cp "esp32/.pio/build/$ENV/firmware.bin" "dist/agentdeck-$BOARD.bin"
          cp "esp32/.pio/build/$ENV/partitions.bin" "dist/agentdeck-$BOARD-partitions.bin"
          # Bootloader may be in different locations
          if [ -f "esp32/.pio/build/$ENV/bootloader.bin" ]; then
            cp "esp32/.pio/build/$ENV/bootloader.bin" "dist/agentdeck-$BOARD-bootloader.bin"
          fi
          # boot_app0 (0xe000) selects which OTA slot boots. It is the ONE input
          # that does not live in .pio/build — it ships inside the Arduino
          # framework package — which is why this step could never have picked
          # it up, and why a hand-assembled flash could write a fresh app0 and
          # still boot the previous slot.
          BOOT_APP0="$(ls -1 "$HOME"/.platformio/packages/framework-arduinoespressif32*/tools/partitions/boot_app0.bin 2>/dev/null | head -1)"
          if [ -z "$BOOT_APP0" ]; then
            echo "boot_app0.bin not found under ~/.platformio/packages" >&2
            exit 1
          fi
          cp "$BOOT_APP0" "dist/agentdeck-$BOARD-boot_app0.bin"
          # The per-board .tsv that used to live here is gone: the release notes
          # are rendered from manifest.json now, so the tsv had become a second
          # board list nothing read or checked — the exact shape this change
          # exists to remove.
          ls -la dist/

      # One file, one offset (0x0), every chip. This is what removes the
      # bootloader-offset, flash-size and boot_app0 hazards from every consumer
      # at once — and the script reads the header back OUT of the merged image
      # to prove it, because merge-bin patches the flash parameters into its own
      # output and nothing else would notice a wrong geometry.
      - name: Merge factory image for ${{ matrix.board.name }}
        run: |
          node scripts/esp32-merge-firmware.mjs \
            --board '${{ matrix.board.board }}' \
            --build-dir "esp32/.pio/build/${{ matrix.board.env }}" \
            --boot-app0 "dist/agentdeck-${{ matrix.board.board }}-boot_app0.bin" \
            --out dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.board.env }}
          path: dist/

  release:
    needs: build   # fail-fast + needs: no partial firmware set can ever publish
    runs-on: ubuntu-latest

    steps:
      # This job publishes artifacts built elsewhere, but the release body is
      # rendered from CHANGELOG.md, so it needs the repository too.
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build shared (board SSOT)
        run: |
          pnpm install --frozen-lockfile --filter @agentdeck/shared...
          pnpm --filter @agentdeck/shared build

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#esp32-v}" >> "$GITHUB_OUTPUT"

      - name: Download all firmware artifacts
        uses: actions/download-artifact@v4
        with:
          path: firmware
          merge-multiple: true

      - name: List firmware files
        run: ls -la firmware/

      - name: Checksums
        run: |
          set -euo pipefail
          cd firmware
          sha256sum agentdeck-*.bin > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # The manifest is what the browser flasher and `agentdeck esp32 flash`
      # actually read: which single file to write, at which offset, and whether
      # a hardware run ever proved this board flashable. It FAILS when a board
      # in the SSOT has missing artifacts — the current failure mode is the
      # opposite, a board that ships nothing while every step stays green.
      - name: Generate firmware manifest
        run: |
          set -euo pipefail
          node scripts/generate-firmware-manifest.mjs firmware --tag "$GITHUB_REF_NAME" > firmware/manifest.json
          node -e "const m=require('./firmware/manifest.json');console.log(m.boards.length+' boards in manifest '+m.release)"

      - name: Render release notes
        run: |
          set -euo pipefail
          # The board table and the USB instructions are rendered from the
          # manifest, so a board that built cannot be left out of the table it
          # is listed in, and the instructions cannot describe a file set that
          # did not ship. This replaces a hand-echoed block whose USB recipe
          # (`write_flash 0x10000 <app>`) was incomplete — no bootloader offset,
          # no boot_app0 — in a way that quietly boots the previous OTA slot.
          node scripts/render-esp32-release-notes.mjs firmware/manifest.json > firmware-detail.md
          node scripts/release-notes.mjs "$GITHUB_REF_NAME" --template firmware-detail.md > notes.md
          cat notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "AgentDeck ESP32 v${{ steps.version.outputs.VERSION }}"
          body_path: notes.md
          files: |
            firmware/agentdeck-*.bin
            firmware/manifest.json
            firmware/SHA256SUMS.txt
