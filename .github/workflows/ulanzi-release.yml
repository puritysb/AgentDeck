name: Ulanzi Release

on:
  push:
    tags:
      - 'ulanzi-v*'

permissions:
  contents: write

jobs:
  build:
    # The artifact contains no native binary at all: the rasterizer is
    # @resvg/resvg-wasm, one file identical on every OS and CPU. The host
    # platform therefore cannot leak into the archive, and the packaging step's
    # verify refuses a bundle carrying a .node/.dylib/.so/.dll anywhere.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify release version
        run: |
          VERSION="${GITHUB_REF_NAME#ulanzi-v}"
          node scripts/verify-release-version.mjs ulanzi "$VERSION"
          node scripts/verify-version-sync.mjs

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.5.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm build

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#ulanzi-v}" >> "$GITHUB_OUTPUT"

      - name: Package plugin
        run: pnpm --filter @agentdeck/plugin-ulanzi package

      - name: Render release notes
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: "AgentDeck Ulanzi v${{ steps.version.outputs.VERSION }}"
          body_path: notes.md
          files: dist/com.ulanzi.ulanzistudio.agentdeck.ulanziPlugin.zip

      - name: Upload packaged plugin artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ulanzi-plugin-v${{ steps.version.outputs.VERSION }}
          path: dist/com.ulanzi.ulanzistudio.agentdeck.ulanziPlugin.zip
