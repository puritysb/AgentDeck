name: Security scan

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tokens:
    name: AgentDeck token detection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node --test scripts/__tests__/token-patterns.test.mjs
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python3 -m pip install hyperscan==0.9.1
      - run: python3 scripts/__tests__/token-hyperscan.test.py
      - run: node scripts/scan-agentdeck-tokens.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: agentdeck-token-scan
          path: diagnostics/token-scan/receipt.json
          retention-days: 30

  firmware:
    name: ESP32 dependency inventory
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python3 scripts/__tests__/esp32-inventory.test.py
      - run: python3 -m pip install platformio==6.1.19
      - name: Resolve every configured target in an isolated project and package store
        run: python3 scripts/inventory-esp32-dependencies.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: esp32-dependency-inventory
          path: |
            diagnostics/esp32-inventory/receipt.json
            diagnostics/esp32-inventory/*/inventory.json
            diagnostics/esp32-inventory/*/install.log
            diagnostics/esp32-inventory/*/collect.log
          retention-days: 30

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.5.0
          run_install: false
      # Auditing the lockfile needs no dependency install or lifecycle scripts.
      - run: pnpm security:audit
      - name: Publish audit summary
        if: always()
        run: |
          if [ -f diagnostics/security-audit/summary.md ]; then
            cat diagnostics/security-audit/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dependency-audit
          path: diagnostics/security-audit/
          retention-days: 30

  python:
    name: Python dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Audit resolved Python requirements
        run: |
          python3 -m venv "$RUNNER_TEMP/audit"
          "$RUNNER_TEMP/audit/bin/pip" install pip-audit==2.10.1
          mkdir -p diagnostics/python-audit
          status=0
          "$RUNNER_TEMP/audit/bin/pip-audit" -r bridge/python/requirements-ble.txt -f json -o diagnostics/python-audit/ble.json || status=1
          "$RUNNER_TEMP/audit/bin/pip-audit" -r esp32/robot/requirements.txt -f json -o diagnostics/python-audit/robot.json || status=1
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: python-dependency-audit
          path: diagnostics/python-audit/
          retention-days: 30

  android:
    name: Android runtime dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: Verify Gradle collector with offline synthetic Maven fixtures
        run: node --test scripts/__tests__/android-runtime-collector.test.mjs
      - name: Resolve both runtime variants and query OSV
        run: node scripts/audit-android-runtime.mjs
      - name: Publish Android audit summary
        if: always()
        run: |
          if [ -f diagnostics/android-audit/summary.md ]; then
            cat diagnostics/android-audit/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-runtime-audit
          path: diagnostics/android-audit/
          retention-days: 30

  rust:
    name: Rust dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install checksum-pinned OSV Scanner
        run: |
          curl --fail --location --retry 3 https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64 -o "$RUNNER_TEMP/osv-scanner"
          echo '160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b  '"$RUNNER_TEMP/osv-scanner" | sha256sum --check
          chmod +x "$RUNNER_TEMP/osv-scanner"
      - name: Scan Rust lockfile without executing build scripts
        run: |
          mkdir -p diagnostics/rust-audit
          "$RUNNER_TEMP/osv-scanner" scan source --config security/osv-scanner.toml --lockfile shared/glance-raster/Cargo.lock --format json --output-file diagnostics/rust-audit/osv.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: rust-dependency-audit
          path: diagnostics/rust-audit/
          retention-days: 30
