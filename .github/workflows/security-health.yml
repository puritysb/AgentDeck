name: Security pipeline health

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  freshness:
    name: Security pipeline freshness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify scan and scheduled-run freshness
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/security-pipeline-health.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: security-pipeline-health
          path: diagnostics/security-health/
          retention-days: 30
