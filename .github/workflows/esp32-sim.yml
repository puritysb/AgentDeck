# The one PR gate that compiles C++ (#243). Every other PR workflow is
# TS/Kotlin/Swift, so before this job an esp32/src change could merge fully
# green without a compiler ever reading it — the failure then surfaced on
# master in test-report.yml (the Pages build-health job) or, for trees the sim
# excludes, not until an esp32-v* tag was cut.
#
# `pio run` in esp32/sim builds every env on the *native* host platform — one
# render tree per env (fw/, mtx/, eink/, knob/, ticker/) compiled against the
# real esp32/src headers — so it needs no Xtensa toolchain and no hardware.
# Deterministic UI assertions run too; physical scanout and the hardware Robot
# suite remain separate evidence.
#
# The scope check keeps the cost off unrelated PRs, but it is a STEP condition,
# not a workflow-level `paths:` filter, because this is a required status check.
# A `paths:`-filtered workflow does not run on a PR outside its paths, so its
# context never reports at all — and branch protection cannot tell "did not
# apply" from "has not finished yet". Measured on #248: a docs-only PR with
# every other check green sat at BLOCKED / "Expected — waiting for status"
# forever. So the job always runs and always reports; when nothing under esp32/
# changed it reports success in ~15s without installing a toolchain.
# (android-test.yml / apple-test.yml keep their `paths:` filters — neither is
# required, so the same shape is fine there.)
#
# Detection is fail-safe in the compile direction: if the diff cannot be
# resolved, compile rather than skip. A wrong skip is a green light on code no
# compiler read, which is the exact hole #243 was opened to close.
#
# The cache key is shared with test-report.yml on purpose: master pushes keep
# the default-branch cache warm, and PR runs restore from it (warm-cache full
# build is ~1–2 minutes; a cold first run measured 3m47s, and only a
# platformio.ini change pays the toolchain download again).
#
# A PR is compiled against the master it was tested with, so two ESP32 PRs that
# each fit can break master together. #565 and #566 merged 8 s apart on
# 2026-10-18, each green, and master's TTGO then overflowed static DRAM by 8
# bytes, which nothing reported. The push run compiles master as merged, with
# the same scope rule: a merge commit's first parent is the previous master tip.
name: ESP32 Sim Compile

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  # The job name — not the workflow name — is the status-check context branch
  # protection pins, so it has to say which gate it is: an unnamed job here
  # would be required as the bare `compile`.
  compile:
    name: ESP32 Sim Compile
    runs-on: ubuntu-latest
    outputs:
      esp32_changed: ${{ steps.scope.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge commit plus both parents, so HEAD^1..HEAD is exactly the
          # PR's net change against the base tip.
          fetch-depth: 2

      - name: Does this change touch the ESP32 tree?
        id: scope
        env:
          # A push is diffed against the tip it replaced, so a push of several
          # commits is judged whole rather than by its last commit.
          PUSH_BEFORE: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: |
          base=''
          if [ -n "$PUSH_BEFORE" ]; then
            git fetch --quiet --depth=1 origin "$PUSH_BEFORE" && base=$PUSH_BEFORE
          else
            base=$(git rev-parse --verify --quiet HEAD^1) || base=''
          fi
          if [ -z "$base" ]; then
            echo "No base to diff against (PR not mergeable?) — compiling to stay safe."
            echo 'run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$base" HEAD)
          if grep -qE '^(esp32/|\.github/workflows/esp32-(sim|release)\.yml$)' <<<"$changed"; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo 'No `esp32/**` change here — nothing to compile.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Cache PlatformIO (sim)
        if: steps.scope.outputs.run == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
            esp32/sim/.pio
          key: pio-sim-${{ hashFiles('esp32/sim/platformio.ini') }}
          restore-keys: pio-sim-

      - name: Install PlatformIO
        if: steps.scope.outputs.run == 'true'
        run: pip install platformio

      - name: Compile every sim env
        if: steps.scope.outputs.run == 'true'
        working-directory: esp32/sim
        run: pio run

      - name: Resident placement and input assertions
        if: steps.scope.outputs.run == 'true'
        run: bash esp32/sim/check-surfaces.sh

      # Plain assert() mains over the firmware's policy headers (e-ink geometry,
      # glyph selection, usage rows, …). Host compiler only, a few seconds; they
      # used to be local-only, so a broken policy header could merge green.
      - name: Host policy assertions
        if: steps.scope.outputs.run == 'true'
        run: bash esp32/sim/run-tests.sh

  # The native simulator cannot catch target linker DRAM overflow. Resolve the
  # pinned TTGO dependencies freshly on the same toolchain as the release.
  ttgo:
    name: ESP32 TTGO Compile
    needs: compile
    if: needs.compile.outputs.esp32_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install release PlatformIO
        run: |
          python -m venv "$HOME/.platformio/penv"
          "$HOME/.platformio/penv/bin/python" -m pip install "pioarduino==6.1.19"
          echo "$HOME/.platformio/penv/bin" >> "$GITHUB_PATH"
          "$HOME/.platformio/penv/bin/pio" --version
      - name: Compile and link TTGO firmware
        working-directory: esp32
        run: pio run -e ttgo
      - name: Verify compiled SDK hardening objects
        run: python esp32/scripts/webserver_security.py esp32/.pio/build/ttgo
      - name: Preserve SDK hardening receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ttgo-sdk-hardening
          path: esp32/.pio/build/ttgo/agentdeck-security/*.json
          retention-days: 30

  # TC001 deliberately retains Arduino 2 / GCC 8. A separate runner/store proves
  # the backports compile on that branch without replacing TTGO's Arduino 3 SDK.
  legacy:
    name: ESP32 legacy TC001 Compile
    needs: compile
    if: needs.compile.outputs.esp32_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install release PlatformIO
        run: |
          python -m venv "$HOME/.platformio/penv"
          "$HOME/.platformio/penv/bin/python" -m pip install "pioarduino==6.1.19"
          echo "$HOME/.platformio/penv/bin" >> "$GITHUB_PATH"
          "$HOME/.platformio/penv/bin/pio" --version
      - name: Compile and link legacy TC001 firmware
        working-directory: esp32
        run: pio run -e led8x32
      - name: Verify compiled SDK hardening objects
        run: python esp32/scripts/webserver_security.py esp32/.pio/build/led8x32
      - name: Preserve SDK hardening receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tc001-sdk-hardening
          path: esp32/.pio/build/led8x32/agentdeck-security/*.json
          retention-days: 30
