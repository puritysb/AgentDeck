name: CodeQL

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  schedule:
    - cron: '43 3 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python, actions, c-cpp, rust]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@793b778da9c9275a0f276522b27cb5fc14bba279 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@793b778da9c9275a0f276522b27cb5fc14bba279 # v4
        with:
          category: /language:${{ matrix.language }}

  kotlin:
    name: CodeQL (java-kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-disabled: true
      - uses: github/codeql-action/init@793b778da9c9275a0f276522b27cb5fc14bba279 # v4
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended
      - name: Compile Android sources for extraction
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-build-cache --rerun-tasks -Pkotlin.compiler.execution.strategy=in-process
      - uses: github/codeql-action/analyze@793b778da9c9275a0f276522b27cb5fc14bba279 # v4
        with:
          category: /language:java-kotlin
