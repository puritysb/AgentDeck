name: CodeQL

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  schedule:
    - cron: '43 3 * * 2'
  workflow_dispatch:

# Only newer commits on the same PR supersede a run. Master, scheduled and
# explicitly dispatched runs retain independent execution and audit history.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python, actions, c-cpp, rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@793b778da9c9275a0f276522b27cb5fc14bba279 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@793b778da9c9275a0f276522b27cb5fc14bba279 # v4
        with:
          category: /language:${{ matrix.language }}

  kotlin:
    name: CodeQL (java-kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          cache-disabled: true
      # GitHub's release download redirect can fail with persistent HTTP 504
      # while its official asset API serves the identical SHA-256-bound bytes.
      - name: Fetch verified Java tools through the release asset API
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/__tests__/github-release-download.test.py
          python3 scripts/github_release_download.py \
            https://github.com/github/codeql-action/releases/download/codeql-bundle-v2.27.4/codeql-bundle-java-linux64.tar.zst \
            "$RUNNER_TEMP/codeql-java.tar.zst"
          python3 - <<'PY'
          import hashlib, os, shutil, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from github_release_download import gradle_release, verified_asset
          properties = Path('android/gradle/wrapper/gradle-wrapper.properties')
          version, url = gradle_release(properties.read_text())
          archive = Path(os.environ['RUNNER_TEMP']) / f'gradle-{version}-bin.zip'
          stream, _ = verified_asset(url)
          with stream, archive.open('wb') as output:
              shutil.copyfileobj(stream, output)
          lines = [line for line in properties.read_text().splitlines() if not line.startswith(('distributionUrl=', 'distributionSha256Sum='))]
          lines += ['distributionUrl=' + archive.as_uri(), 'distributionSha256Sum=' + hashlib.sha256(archive.read_bytes()).hexdigest()]
          properties.write_text('\n'.join(lines) + '\n')
          PY
      - uses: github/codeql-action/init@793b778da9c9275a0f276522b27cb5fc14bba279 # v4
        with:
          tools: ${{ runner.temp }}/codeql-java.tar.zst
          languages: java-kotlin
          build-mode: manual
          queries: security-extended
      - name: Compile Android sources for extraction
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-build-cache --rerun-tasks -Pkotlin.compiler.execution.strategy=in-process
      - uses: github/codeql-action/analyze@793b778da9c9275a0f276522b27cb5fc14bba279 # v4
        with:
          category: /language:java-kotlin

  swift:
    name: CodeQL (swift-${{ matrix.target }})
    # Intel is supported by CodeQL and avoids the arm64 hosted-capacity queue.
    # The extracted app target stays arm64 with the same pinned Xcode below.
    runs-on: macos-26-intel
    # A cold macOS trace completed analysis at the old 45m deadline, then
    # timed out during cleanup. On 2026-11-05 two consecutive PR #731 attempts
    # on the same macos-26-intel image spent 49m and 51m in extraction (25m on
    # the previous master push) and were cancelled at 60m mid-analysis; GitHub
    # then refused a third retry. 90m keeps the slow-runner case completing.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos
            scheme: AgentDeck_macOS
            destination: platform=macOS
          - target: ios
            scheme: AgentDeck_iOS
            destination: generic/platform=iOS Simulator
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7dcc700092a1a8b9c17ba0e140b4e34e93000946 # 1.90.0
        with:
          targets: aarch64-apple-darwin
      - name: Select Xcode and generate project
        run: |
          # Xcode 27 / Swift 6.4 cannot be traced by CodeQL. Do not select the
          # newest preview installed on the runner. Missing support fails closed.
          test -d /Applications/Xcode_26.6.app
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          xcrun swift -version | tee "$RUNNER_TEMP/codeql-swift-version.txt"
          grep -Eq 'Swift version (5\.|6\.[0-3][. ])' "$RUNNER_TEMP/codeql-swift-version.txt"
          brew install xcodegen
          cd apple
          xcodegen generate
      - uses: github/codeql-action/init@793b778da9c9275a0f276522b27cb5fc14bba279 # v4
        with:
          languages: swift
          build-mode: manual
          queries: security-extended
      - name: Compile app for extraction
        run: |
          xcodebuild build -project apple/AgentDeck.xcodeproj -scheme '${{ matrix.scheme }}' \
            -configuration Debug -destination '${{ matrix.destination }}' \
            -derivedDataPath "$RUNNER_TEMP/CodeQLDerivedData" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO \
            SWIFT_USE_INTEGRATED_DRIVER=NO COMPILATION_CACHE_ENABLE_CACHING=NO SWIFT_ENABLE_COMPILE_CACHE=NO \
            SWIFT_COMPILATION_MODE=wholemodule SWIFT_OPTIMIZATION_LEVEL=-Onone
      - uses: github/codeql-action/analyze@793b778da9c9275a0f276522b27cb5fc14bba279 # v4
        with:
          category: /language:swift-${{ matrix.target }}
