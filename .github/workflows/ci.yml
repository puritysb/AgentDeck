name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Product version sync
        run: pnpm verify-version

      - name: Build
        run: pnpm build

      - name: Type check
        run: pnpm typecheck

      # ESLint was configured but ran nowhere, so errors only accumulated.
      # Ratchet: the count may fall, never rise (scripts/eslint-baseline.json).
      - name: ESLint error ratchet
        run: node scripts/check-eslint-baseline.mjs

      # One run, not two: `--coverage` executes the same suite as `pnpm test`
      # and additionally enforces the thresholds in vitest.config.ts. Running
      # both cost a full extra pass (~60 s) for no additional signal.
      - name: Test + coverage thresholds
        run: npx vitest run --coverage
        env:
          COLORTERM: truecolor
          TZ: Asia/Seoul

      # The real `agentdeck daemon start` process in a temp HOME, loopback-only,
      # every device module off (tests/e2e/daemon-hub.e2e.test.ts). Needs the
      # build above; takes a few seconds.
      - name: Daemon hub end-to-end
        run: pnpm test:e2e
        env:
          TZ: Asia/Seoul

      - name: Preview mirror sync check
        run: node scripts/check-preview-mirror-sync.mjs

      # Backstop only — the same drift now fails locally in `pnpm test`
      # (shared/src/__tests__/protocol-generated-sync.test.ts), which is what
      # stops it reaching master in the first place. command-builders.ts is
      # generated from protocol.ts too and was previously left ungated here.
      - name: Protocol drift check
        run: |
          pnpm generate-protocol
          if ! git diff --quiet generated/protocol/ shared/src/command-builders.ts; then
            echo "::error::Protocol artifacts are out of sync with shared/src/*protocol.ts."
            echo "::error::Run 'pnpm generate-protocol' locally and commit the result."
            git diff generated/protocol/ shared/src/command-builders.ts
            exit 1
          fi

  # Cases gated on process.platform === 'darwin' (generated-Swift parity
  # vectors, launchd probes, the Foundation Models helper build) are skipped on
  # ubuntu, and apple-test.yml runs XCTest, not Vitest, so before this job they
  # ran on no CI runner at all. The file list mirrors the macos-native-parity
  # gate in scripts/verification-catalog.json; verification-catalog.test.ts
  # fails when a darwin-gated test file is missing from either.
  macos-native-parity:
    name: macOS native parity (Swift toolchain)
    runs-on: macos-26
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Using: $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # bridge imports @agentdeck/shared through its built package entry, and
      # scripts/generate-tui-creatures.mjs reads bridge/dist (same set as the
      # Windows job builds).
      - name: Build shared, hooks and bridge
        run: |
          pnpm --filter @agentdeck/shared build
          pnpm --filter @agentdeck/hooks build
          pnpm --filter @agentdeck/bridge build

      - name: macOS-gated Vitest cases
        run: pnpm exec vitest run shared/src/__tests__/daemon-parity.test.ts shared/src/__tests__/ci-wait-sync.test.ts bridge/src/__tests__/ips10-roster.test.ts bridge/src/__tests__/matrix-expression.test.ts bridge/src/__tests__/tui-terrarium-snapshots.test.ts bridge/src/__tests__/daemon-supervisor.test.ts bridge/src/__tests__/fm-helper-build.test.ts
        env:
          TZ: Asia/Seoul

  windows-native-runtime:
    name: Windows native runtime (Node ${{ matrix.node }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # better-sqlite3 is intentionally optional at the npm layer so the
      # daemon can retain its no-APME fallback. Its install failure therefore
      # exits zero; the diagnostic smoke test below is the actual prebuild
      # availability gate for every runtime AgentDeck claims to support.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build bridge diagnostic
        run: |
          pnpm --filter @agentdeck/shared build
          pnpm --filter @agentdeck/hooks build
          pnpm --filter @agentdeck/bridge build

      - name: Open SQLite through the daemon runtime
        run: node bridge/dist/cli.js diag native --json

      - name: Windows hooks, observers and Ulanzi transport regressions
        run: pnpm exec vitest run hooks/src/__tests__/install.test.ts hooks/src/__tests__/codex-install.test.ts hooks/src/__tests__/windows-codex-pid.test.ts bridge/src/__tests__/passive-observer.test.ts bridge/src/__tests__/state-machine.test.ts bridge/src/__tests__/daemon-launcher.test.ts bridge/src/__tests__/daemon-supervisor.test.ts bridge/src/__tests__/observed-launch.test.ts bridge/src/__tests__/observed-launch-integration.test.ts bridge/src/__tests__/connection-diagnostics.test.ts plugin-ulanzi/src/__tests__/daemon-discovery.test.ts plugin-ulanzi/src/__tests__/daemon-client.test.ts plugin-ulanzi/src/__tests__/daemon-transport.test.ts --maxWorkers=2
