name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Product version sync
        run: pnpm verify-version

      - name: Build
        run: pnpm build

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test
        env:
          COLORTERM: truecolor
          TZ: Asia/Seoul

      - name: Coverage check
        run: npx vitest run --coverage
        env:
          COLORTERM: truecolor
          TZ: Asia/Seoul

      - name: Preview mirror sync check
        run: node scripts/check-preview-mirror-sync.mjs

      # Backstop only — the same drift now fails locally in `pnpm test`
      # (shared/src/__tests__/protocol-generated-sync.test.ts), which is what
      # stops it reaching master in the first place. command-builders.ts is
      # generated from protocol.ts too and was previously left ungated here.
      - name: Protocol drift check
        run: |
          pnpm generate-protocol
          if ! git diff --quiet generated/protocol/ shared/src/command-builders.ts; then
            echo "::error::Protocol artifacts are out of sync with shared/src/*protocol.ts."
            echo "::error::Run 'pnpm generate-protocol' locally and commit the result."
            git diff generated/protocol/ shared/src/command-builders.ts
            exit 1
          fi

  windows-native-runtime:
    name: Windows native runtime (Node ${{ matrix.node }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # better-sqlite3 is intentionally optional at the npm layer so the
      # daemon can retain its no-APME fallback. Its install failure therefore
      # exits zero; the diagnostic smoke test below is the actual prebuild
      # availability gate for every runtime AgentDeck claims to support.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build bridge diagnostic
        run: |
          pnpm --filter @agentdeck/shared build
          pnpm --filter @agentdeck/hooks build
          pnpm --filter @agentdeck/bridge build

      - name: Open SQLite through the daemon runtime
        run: node bridge/dist/cli.js diag native --json

      - name: Windows hooks and observer regressions
        run: pnpm exec vitest run hooks/src/__tests__/install.test.ts bridge/src/__tests__/passive-observer.test.ts bridge/src/__tests__/state-machine.test.ts bridge/src/__tests__/daemon-launcher.test.ts bridge/src/__tests__/daemon-supervisor.test.ts bridge/src/__tests__/observed-launch.test.ts bridge/src/__tests__/observed-launch-integration.test.ts --maxWorkers=2
