name: Apple Release (TestFlight)

on:
  push:
    tags:
      - 'apple-v*'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Numeric marketing version to archive/export'
        required: true
        default: '1.0.5'
        type: string
      upload:
        description: 'Upload the exported artifacts to App Store Connect'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  # Fail before burning two 30-minute archive jobs (and before consuming a
  # build number) if the submission bundle itself is invalid.
  validate-submission:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg (App Preview probing)
        run: brew install ffmpeg

      - name: Validate App Store submission bundle
        run: bash apple/scripts/validate-appstore-submission.sh

  build-ios:
    needs: validate-submission
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Verify release version
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.release_version }}"
          else
            VERSION="${GITHUB_REF_NAME#apple-v}"
          fi
          node scripts/verify-release-version.mjs apple "$VERSION"
          node scripts/verify-version-sync.mjs

      - name: Select Xcode
        run: |
          XCODE=$(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' | sort -V | tail -1)
          echo "Using: $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"

      # Archive the project derived from project.yml rather than the committed
      # .xcodeproj, so a project.yml edit whose pbxproj was never regenerated
      # cannot ship a stale project. (Byte-comparing the committed pbxproj is
      # not a viable gate: xcodegen orders targets differently between patch
      # releases, so the check would fail on tool-version skew, not real drift.)
      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Regenerate Xcode project
        working-directory: apple
        run: xcodegen generate

      - name: Extract version from tag
        id: version
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.release_version }}"
          else
            VERSION="${GITHUB_REF_NAME#apple-v}"
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      # Persistent manual signing prevents ephemeral runners from creating a
      # fresh DEVELOPMENT certificate for every archive job. The helper also
      # rejects a p12/profile from the retired personal team or bundle id.
      - name: Install iOS signing assets
        env:
          APPLE_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: bash apple/scripts/install-ci-signing-assets.sh ios

      # CI owns the build number: ASC rejects re-uploading a (MARKETING_VERSION,
      # CURRENT_PROJECT_VERSION) pair it has already seen, so the value in
      # project.yml is only a local-build default.
      #
      # run_number alone is NOT enough: "Re-run jobs" keeps run_number and only
      # bumps run_attempt, so re-running a partially-failed release (iOS uploaded,
      # macOS archive failed) would re-upload iOS with an identical pair and altool
      # would reject it. run_number*100 + run_attempt is strictly monotonic across
      # both re-tags and re-runs.
      - name: Archive iOS
        run: |
          xcodebuild archive \
            -project apple/AgentDeck.xcodeproj \
            -scheme AgentDeck_iOS \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/AgentDeck_iOS.xcarchive" \
            MARKETING_VERSION=${{ steps.version.outputs.VERSION }} \
            CURRENT_PROJECT_VERSION=$(( ${{ github.run_number }} * 100 + ${{ github.run_attempt }} )) \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="AgentDeck Dashboard AppStore" \
            DEVELOPMENT_TEAM=QF36NDHYHD \
            ENABLE_PREVIEWS=NO

      - name: Export iOS IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/AgentDeck_iOS.xcarchive" \
            -exportOptionsPlist apple/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export_ios"

      - name: Verify iOS App Store invariants (exported IPA)
        # Guards against bundled helpers (Apple 2.5.2), `home-relative-path`
        # entitlement exceptions, and stray embedded executables. Runs on the
        # final EXPORTED app (distribution-signed), matching the artifact that
        # is uploaded to App Store Connect.
        run: |
          unzip -q "$RUNNER_TEMP/export_ios/AgentDeck.ipa" -d "$RUNNER_TEMP/ipa_unpacked"
          bash apple/scripts/verify-appstore-archive.sh \
            "$RUNNER_TEMP/ipa_unpacked/Payload/AgentDeck.app"

      - name: Upload iOS to TestFlight
        if: ${{ github.event_name == 'push' || inputs.upload }}
        run: |
          mkdir -p ~/private_keys
          echo -n "${{ secrets.ASC_API_KEY_BASE64 }}" | base64 --decode -o ~/private_keys/AuthKey_${{ secrets.ASC_API_KEY_ID }}.p8
          xcrun altool --upload-app \
            -f "$RUNNER_TEMP/export_ios/AgentDeck.ipa" \
            -t ios \
            --apiKey ${{ secrets.ASC_API_KEY_ID }} \
            --apiIssuer ${{ secrets.ASC_ISSUER_ID }}

      - name: Cleanup
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/apple-distribution.p12"
          rm -rf ~/private_keys

  build-macos:
    needs: validate-submission
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Verify release version
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.release_version }}"
          else
            VERSION="${GITHUB_REF_NAME#apple-v}"
          fi
          node scripts/verify-release-version.mjs apple "$VERSION"
          node scripts/verify-version-sync.mjs

      - name: Select Xcode
        run: |
          XCODE=$(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' | sort -V | tail -1)
          echo "Using: $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"

      # Archive the project derived from project.yml rather than the committed
      # .xcodeproj, so a project.yml edit whose pbxproj was never regenerated
      # cannot ship a stale project. (Byte-comparing the committed pbxproj is
      # not a viable gate: xcodegen orders targets differently between patch
      # releases, so the check would fail on tool-version skew, not real drift.)
      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Regenerate Xcode project
        working-directory: apple
        run: xcodegen generate

      - name: Extract version from tag
        id: version
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.release_version }}"
          else
            VERSION="${GITHUB_REF_NAME#apple-v}"
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install macOS signing assets
        env:
          APPLE_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          APPLE_INSTALLER_CERTIFICATE_BASE64: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          MACOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.MACOS_PROVISIONING_PROFILE_BASE64 }}
        run: bash apple/scripts/install-ci-signing-assets.sh macos

      - name: Archive macOS
        run: |
          xcodebuild archive \
            -project apple/AgentDeck.xcodeproj \
            -scheme AgentDeck_macOS \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/AgentDeck_macOS.xcarchive" \
            MARKETING_VERSION=${{ steps.version.outputs.VERSION }} \
            CURRENT_PROJECT_VERSION=$(( ${{ github.run_number }} * 100 + ${{ github.run_attempt }} )) \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="AgentDeck Dashboard macOS AppStore" \
            DEVELOPMENT_TEAM=QF36NDHYHD

      - name: Export macOS pkg
        run: |
          EXPORT_OPTIONS="$RUNNER_TEMP/ExportOptions-macOS.plist"
          cp apple/ExportOptions-macOS.plist "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy \
            -c "Add :installerSigningCertificate string $MAC_INSTALLER_IDENTITY" \
            "$EXPORT_OPTIONS"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/AgentDeck_macOS.xcarchive" \
            -exportOptionsPlist "$EXPORT_OPTIONS" \
            -exportPath "$RUNNER_TEMP/export_macos"

      - name: Verify App Store invariants (exported pkg)
        # Fails the build if bundled Node/adb/bridge helpers, iOS-only plist
        # keys, home-relative-path entitlement, or subprocess path strings
        # somehow leaked into the .app. Apple Guideline 2.5.2 enforcement.
        # Runs on the final EXPORTED app (distribution-signed), matching the
        # artifact that is uploaded to App Store Connect.
        run: |
          pkgutil --expand-full "$RUNNER_TEMP/export_macos/AgentDeck.pkg" "$RUNNER_TEMP/pkg_expanded"
          APP=$(find "$RUNNER_TEMP/pkg_expanded" -type d -name 'AgentDeck.app' | head -1)
          test -n "$APP"
          bash apple/scripts/verify-appstore-archive.sh "$APP"

      - name: Upload macOS to App Store Connect
        if: ${{ github.event_name == 'push' || inputs.upload }}
        run: |
          mkdir -p ~/private_keys
          echo -n "${{ secrets.ASC_API_KEY_BASE64 }}" | base64 --decode -o ~/private_keys/AuthKey_${{ secrets.ASC_API_KEY_ID }}.p8
          xcrun altool --upload-app \
            -f "$RUNNER_TEMP/export_macos/AgentDeck.pkg" \
            -t macos \
            --apiKey ${{ secrets.ASC_API_KEY_ID }} \
            --apiIssuer ${{ secrets.ASC_ISSUER_ID }}

      - name: Cleanup
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/apple-distribution.p12" "$RUNNER_TEMP/apple-installer.p12"
          rm -rf ~/private_keys

  release:
    if: github.event_name == 'push'
    needs: [build-ios, build-macos]
    runs-on: ubuntu-latest
    steps:
      # github.ref_name is the full tag (apple-v1.0.0); strip the channel prefix
      # so the release reads "AgentDeck Apple v1.0.0", not "…vapple-v1.0.0".
      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#apple-v}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: 'AgentDeck Apple v${{ steps.version.outputs.version }}'
          body: |
            ## AgentDeck Apple v${{ steps.version.outputs.version }}

            Universal dashboard app for monitoring coding agent sessions.

            ### Install via TestFlight
            1. Open **TestFlight** on your iPhone/iPad/Mac
            2. Accept the invite or check for available builds
            3. Install **AgentDeck Dashboard**
