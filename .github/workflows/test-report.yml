name: GitHub Pages & Build Health

on:
  push:
    branches: [master]

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  report:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Cache PlatformIO (sim)
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
            esp32/sim/.pio
          key: pio-sim-${{ hashFiles('esp32/sim/platformio.ini') }}
          restore-keys: pio-sim-

      - name: Install PlatformIO (demo ESP32 frames)
        run: pip install platformio

      - name: Build creature-simulator demo
        run: pnpm run demo:build

      - name: Build design system viewer
        run: pnpm run design-system:build

      # The browser flasher. A Vite app, not a self-contained HTML file:
      # esptool-js is an npm package with runtime deps and the CDN ban applies,
      # so something has to bundle it (same reason as the creature simulator).
      - name: Build web flasher
        run: pnpm run flash:build

      - name: Run Vitest with coverage
        id: vitest
        continue-on-error: true
        run: |
          mkdir -p coverage/test-report
          npx vitest run --reporter=json --reporter=default --outputFile=coverage/test-report/vitest.json --coverage
        env:
          COLORTERM: truecolor
          TZ: Asia/Seoul

      - name: Run Android tests
        id: android
        continue-on-error: true
        run: cd android && ./gradlew testDebugUnitTest

      - name: Fetch previous history
        run: |
          PAGES_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          curl -sf "${PAGES_URL}/reports/history.json" -o coverage/test-report/history.json || echo '[]' > coverage/test-report/history.json
        continue-on-error: true

      - name: Generate HTML report
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          report_dir = Path("coverage/test-report")
          report_dir.mkdir(parents=True, exist_ok=True)

          def normalize(status):
              return {"success": "pass", "failure": "fail", "cancelled": "error"}.get(status, "not-run")

          def suite(status, executed, note):
              return {"status": normalize(status), "executed": executed, "note": note}

          data = {
              "run_profile": "github-pages",
              "suites": {
                  "vitest": suite(os.environ["VITEST_OUTCOME"], True, "Coverage + JSON report"),
                  "android": suite(os.environ["ANDROID_OUTCOME"], True, "JUnit + Robolectric on ubuntu"),
                  "apple": suite("not-run", False, "Not executed in Pages workflow (requires macOS runner)"),
                  "robot": suite("not-run", False, "Physical hardware suite; not executed on GitHub-hosted runners"),
              },
          }
          (report_dir / "run-metadata.json").write_text(json.dumps(data, indent=2), encoding="utf-8")
          PY
          python3 scripts/generate-html-report.py
        env:
          VITEST_OUTCOME: ${{ steps.vitest.outcome }}
          ANDROID_OUTCOME: ${{ steps.android.outcome }}
          GITHUB_SHA: ${{ github.sha }}

      # Resolved BEFORE the cache step, because the tag IS the cache key.
      #
      # One resolver, not two. This used to re-derive the tag in bash, which
      # meant the real decision was made by an untested duplicate while the
      # tested resolveTag() only ever saw the explicit --tag this step passed
      # it. `--print-tag` prints the tag on stdout and its reasoning on stderr.
      #
      # `|| true` is load-bearing: GitHub runs `run:` as `bash -e {0}`, so a
      # failing command substitution in an assignment aborts the whole step —
      # and a transient rate-limit on the GitHub API would then take down
      # reports, design-system and devices along with the flasher, while both
      # steps below are carefully fail-soft on an empty tag.
      - name: Resolve firmware tag
        id: fwtag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(node scripts/fetch-flash-firmware.mjs --print-tag) || true
          echo "resolved tag: ${TAG:-<none>}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Cache firmware images
        if: steps.fwtag.outputs.tag != ''
        uses: actions/cache@v4
        with:
          path: _site/flash/fw
          key: flash-fw-${{ steps.fwtag.outputs.tag }}

      # GitHub Release assets carry no CORS headers (measured), so the browser
      # cannot fetch them — the images must be served from this origin. The
      # script re-verifies every file's sha256 against the release manifest,
      # cache hits included, and fails the deploy on a mismatch: a flasher that
      # ships the wrong firmware is worse than a deploy that went red.
      - name: Fetch firmware for the flasher
        if: steps.fwtag.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/fetch-flash-firmware.mjs --out _site/flash/fw

      - name: Assemble Pages site
        run: |
          mkdir -p _site/reports _site/demo _site/hardware _site/gallery _site/docs _site/design-system _site/flash
          # Landing page at root
          cp scripts/pages-index.html _site/index.html
          cp docs/media/agentdeck-icon.png _site/icon.png
          # Public Devices catalog under /hardware/ (self-contained single file)
          cp docs/hardware/index.html _site/hardware/index.html
          # Real device photography/screenshots referenced by the catalog cards
          # (missing files degrade to the hatch placeholder via <img onerror>)
          mkdir -p _site/media
          cp docs/media/*.jpg _site/media/ 2>/dev/null || true
          # Required real-app motion demo for the overview (fail on missing media).
          cp docs/media/aquarium-demo.mp4 docs/media/aquarium-preview.gif docs/media/aquarium-story.*.vtt _site/media/
          cp docs/media/macos-dashboard.png _site/media/ 2>/dev/null || true
          cp docs/media/android-eink.png _site/media/ 2>/dev/null || true
          cp docs/media/tui-dashboard.png _site/media/ 2>/dev/null || true
          # Backward-compatible /gallery/ redirect (gallery content now lives in Devices)
          cp docs/gallery/index.html _site/gallery/index.html
          # Documentation hub under /docs/
          cp docs/site/index.html _site/docs/index.html
          # Rendered Markdown, metadata, design tokens, and canonical assets
          cp -R dist/design-system/. _site/design-system/
          # Live demo under /demo/
          cp -R dist/demo/. _site/demo/
          # Browser flasher under /flash/. The firmware images under
          # _site/flash/fw/ were written by the fetch step above; copying the
          # built app on top leaves them alone.
          cp -R dist/flash/. _site/flash/
          # Test report under /reports/
          cp coverage/test-report/index.html _site/reports/index.html
          cp coverage/test-report/history.json _site/reports/history.json 2>/dev/null || true
          cp coverage/test-report/summary.json _site/reports/summary.json 2>/dev/null || true
          cp coverage/test-report/run-metadata.json _site/reports/run-metadata.json 2>/dev/null || true

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
