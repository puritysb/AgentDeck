name: GitHub Pages & Build Health

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

concurrency:
  group: pages
  cancel-in-progress: false

permissions: {}

jobs:
  report:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.head_sha == github.sha &&
      github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
      artifact_name: ${{ steps.bundle.outputs.name }}

    steps:
      # workflow_run's own SHA is the default branch revision, not an event-supplied ref.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify and restore CI report data
        id: producer
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCER_RUN_ID: ${{ github.event.workflow_run.id }}
          PRODUCER_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          python3 scripts/restore-pages-data.py "$RUNNER_TEMP/pages-data"
          {
            echo "BUILD_HEALTH_REPORT_DIR=$RUNNER_TEMP/pages-data/test-report"
            echo "BUILD_HEALTH_COVERAGE_JSON=$RUNNER_TEMP/pages-data/coverage-summary.json"
            echo "BUILD_HEALTH_ANDROID_DIR=$RUNNER_TEMP/pages-data/android"
          } >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.5.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build renderer packages from the checked-out revision
        run: pnpm --filter @agentdeck/shared build && pnpm --filter @agentdeck/hooks build && pnpm --filter @agentdeck/bridge build

      - name: Cache PlatformIO (sim)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
            esp32/sim/.pio
          key: pio-sim-${{ hashFiles('esp32/sim/platformio.ini') }}
          restore-keys: pio-sim-

      - name: Install PlatformIO (demo ESP32 frames)
        run: pip install platformio

      - name: Build creature-simulator demo
        run: pnpm run demo:build

      - name: Build design system viewer
        run: pnpm run design-system:build

      # The browser flasher. A Vite app, not a self-contained HTML file:
      # esptool-js is an npm package with runtime deps and the CDN ban applies,
      # so something has to bundle it (same reason as the creature simulator).
      - name: Build web flasher
        run: pnpm run flash:build

      - name: Fetch previous history
        run: |
          PAGES_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          curl -sf "${PAGES_URL}/reports/history.json" -o "$BUILD_HEALTH_REPORT_DIR/history.json" || echo '[]' > "$BUILD_HEALTH_REPORT_DIR/history.json"
        continue-on-error: true

      # Apple XCTest, the macOS/Windows runtime jobs, the ESP32 compile and the
      # release workflows run elsewhere; the page links their latest result
      # instead of saying only "not run here". Fail-soft: no data, no claim.
      - name: Fetch latest result of every other workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/fetch-workflow-status.mjs --out "$BUILD_HEALTH_REPORT_DIR/workflow-status.json" || true

      - name: Generate HTML report
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          report_dir = Path(os.environ["BUILD_HEALTH_REPORT_DIR"])
          report_dir.mkdir(parents=True, exist_ok=True)

          def normalize(status):
              return {"success": "pass", "failure": "fail", "cancelled": "error"}.get(status, "not-run")

          def suite(status, executed, note):
              return {"status": normalize(status), "executed": executed, "note": note}

          android_note = "JUnit + Robolectric on ubuntu"
          if os.environ["ANDROID_OUTCOME"] == "skipped":
              android_note = "Outside Android scope for this commit."
              status_path = report_dir / "workflow-status.json"
              if status_path.exists():
                  previous = json.loads(status_path.read_text())["workflows"].get(".github/workflows/android-test.yml")
                  if previous:
                      android_note += f" Latest reported Android result: {previous['conclusion']} at {previous['head_sha'][:12]}."
          data = {
              "run_profile": "github-pages",
              "suites": {
                  "vitest": suite(os.environ["VITEST_OUTCOME"], os.environ["VITEST_OUTCOME"] in ("success", "failure"), "Coverage + JSON report"),
                  "e2e": suite(os.environ["E2E_OUTCOME"], os.environ["E2E_OUTCOME"] in ("success", "failure"), "Real daemon process, loopback, temp HOME"),
                  "android": suite(os.environ["ANDROID_OUTCOME"], os.environ["ANDROID_OUTCOME"] in ("success", "failure"), android_note),
                  "apple": suite("not-run", False, "Runs in the Apple Tests workflow (Xcode 27) on apple/** changes; not re-run here"),
                  "robot": suite("not-run", False, "Physical boards in the maintainer's lab; the pre-release receipt records the last attested result"),
              },
          }
          (report_dir / "run-metadata.json").write_text(json.dumps(data, indent=2), encoding="utf-8")
          PY
          python3 scripts/generate-html-report.py
        env:
          VITEST_OUTCOME: ${{ steps.producer.outputs.vitest }}
          E2E_OUTCOME: ${{ steps.producer.outputs.e2e }}
          ANDROID_OUTCOME: ${{ steps.producer.outputs.android }}

      # Resolved BEFORE the cache step, because the tag IS the cache key.
      #
      # One resolver, not two. This used to re-derive the tag in bash, which
      # meant the real decision was made by an untested duplicate while the
      # tested resolveTag() only ever saw the explicit --tag this step passed
      # it. `--print-tag` prints the tag on stdout and its reasoning on stderr.
      #
      # `|| true` is load-bearing: GitHub runs `run:` as `bash -e {0}`, so a
      # failing command substitution in an assignment aborts the whole step —
      # and a transient rate-limit on the GitHub API would then take down
      # reports, design-system and devices along with the flasher, while both
      # steps below are carefully fail-soft on an empty tag.
      - name: Resolve firmware tag
        id: fwtag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(node scripts/fetch-flash-firmware.mjs --print-tag) || true
          echo "resolved tag: ${TAG:-<none>}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Cache firmware images
        if: steps.fwtag.outputs.tag != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: _site/flash/fw
          key: flash-fw-${{ steps.fwtag.outputs.tag }}

      # GitHub Release assets carry no CORS headers (measured), so the browser
      # cannot fetch them — the images must be served from this origin. The
      # script re-verifies every file's sha256 against the release manifest,
      # cache hits included, and fails the deploy on a mismatch: a flasher that
      # ships the wrong firmware is worse than a deploy that went red.
      - name: Fetch firmware for the flasher
        if: steps.fwtag.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/fetch-flash-firmware.mjs --out _site/flash/fw

      - name: Assemble Pages site
        run: |
          mkdir -p _site/reports _site/demo _site/hardware _site/gallery _site/docs _site/design-system _site/flash
          # Landing page at root
          cp scripts/pages-index.html _site/index.html
          cp docs/media/agentdeck-icon.png _site/icon.png
          # Public Devices catalog under /hardware/ (self-contained single file)
          cp docs/hardware/index.html _site/hardware/index.html
          # Real device photography/screenshots referenced by the catalog cards
          # (missing files degrade to the hatch placeholder via <img onerror>)
          mkdir -p _site/media
          cp docs/media/*.jpg _site/media/ 2>/dev/null || true
          # Required real-app motion demo for the overview (fail on missing media).
          cp docs/media/aquarium-demo.mp4 docs/media/aquarium-preview.gif docs/media/aquarium-story.*.vtt _site/media/
          cp docs/media/aquarium-180-showcase.mp4 docs/media/aquarium-180.*.vtt _site/media/
          cp -R docs/media/current _site/media/
          cp docs/media/macos-dashboard.png _site/media/ 2>/dev/null || true
          cp docs/media/android-eink.png _site/media/ 2>/dev/null || true
          cp docs/media/tui-dashboard.png _site/media/ 2>/dev/null || true
          # Backward-compatible /gallery/ redirect (gallery content now lives in Devices)
          cp docs/gallery/index.html _site/gallery/index.html
          # Documentation hub under /docs/
          cp docs/site/index.html _site/docs/index.html
          # Rendered Markdown, metadata, design tokens, and canonical assets
          cp -R dist/design-system/. _site/design-system/
          # Live demo under /demo/
          cp -R dist/demo/. _site/demo/
          # Browser flasher under /flash/. The firmware images under
          # _site/flash/fw/ were written by the fetch step above; copying the
          # built app on top leaves them alone.
          cp -R dist/flash/. _site/flash/
          # Test report under /reports/
          cp "$BUILD_HEALTH_REPORT_DIR/index.html" _site/reports/index.html
          cp "$BUILD_HEALTH_REPORT_DIR/history.json" _site/reports/history.json 2>/dev/null || true
          cp "$BUILD_HEALTH_REPORT_DIR/summary.json" _site/reports/summary.json 2>/dev/null || true
          cp "$BUILD_HEALTH_REPORT_DIR/run-metadata.json" _site/reports/run-metadata.json 2>/dev/null || true
          cp "$BUILD_HEALTH_REPORT_DIR/workflow-status.json" _site/reports/workflow-status.json 2>/dev/null || true
          cp scripts/verification-catalog.json _site/reports/verification-catalog.json

      - name: Name the Pages bundle for this build attempt
        id: bundle
        run: echo "name=github-pages-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Upload Pages artifact
        id: upload
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: ${{ steps.bundle.outputs.name }}
          path: _site

  deploy:
    needs: report
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Confirm this is still the latest master before publishing
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq .object.sha)
          if [[ "$latest" == "$GITHUB_SHA" ]]; then echo publish=true >> "$GITHUB_OUTPUT"; fi

      - name: Verify the site bundle handed off by the build
        if: steps.current.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.report.outputs.artifact_id }}
          ARTIFACT_NAME: ${{ needs.report.outputs.artifact_name }}
        run: |
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ && "$ARTIFACT_NAME" =~ ^github-pages-[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" |
            jq -e --arg name "$ARTIFACT_NAME" --arg sha "$GITHUB_SHA" \
              --argjson run "$GITHUB_RUN_ID" --argjson repo "$GITHUB_REPOSITORY_ID" '
              .name == $name and .expired == false and
              (.digest | strings | test("^sha256:[0-9a-f]{64}$")) and
              (.workflow_run | .id == $run and .head_sha == $sha and .head_branch == "master" and
                .repository_id == $repo and .head_repository_id == $repo)
            '

      - name: Deploy to GitHub Pages
        if: steps.current.outputs.publish == 'true'
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: ${{ needs.report.outputs.artifact_name }}
