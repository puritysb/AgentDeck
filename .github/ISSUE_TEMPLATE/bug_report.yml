name: Bug report
description: Report a reproducible AgentDeck problem
title: '[Bug]: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. For vulnerabilities, use the private reporting link in SECURITY.md instead.
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - CLI or daemon
        - Terminal dashboard
        - Stream Deck plugin
        - Ulanzi D200H plugin
        - macOS app
        - iPhone or iPad app
        - Android or e-ink app
        - ESP32 or LED device
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag, package version, app build, or commit SHA
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, hardware, agent CLI and version, and relevant network topology
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Start ...
        2. Connect ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
      description: Remove tokens, credentials, private source code, names, and device identifiers.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: I removed secrets and private information from this report.
          required: true
