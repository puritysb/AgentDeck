import groovy.json.JsonOutput
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.api.artifacts.component.ProjectComponentIdentifier
import org.gradle.api.artifacts.result.UnresolvedDependencyResult

// Invoked explicitly with -I; it never changes the application build file.
gradle.projectsEvaluated {
    def app = gradle.rootProject.findProject(':app')
    if (app == null) throw new GradleException('Android :app project is missing')
    app.tasks.register('agentdeckRuntimeInventory') {
        doLast {
            def output = app.findProperty('agentdeckInventoryOutput')
            if (!output) throw new GradleException('agentdeckInventoryOutput is required')
            def configurations = [:]
            ['debugRuntimeClasspath', 'releaseRuntimeClasspath'].each { name ->
                def configuration = app.configurations.findByName(name)
                if (configuration == null || !configuration.canBeResolved) {
                    throw new GradleException("Runtime configuration unavailable: ${name}")
                }
                def graph = configuration.incoming.resolutionResult
                if (graph.allDependencies.any { it instanceof UnresolvedDependencyResult }) {
                    throw new GradleException("Unresolved runtime dependencies: ${name}")
                }
                def modules = graph.allComponents.collect { component ->
                    def id = component.id
                    if (id instanceof ModuleComponentIdentifier) {
                        return [group: id.group, name: id.module, version: id.version]
                    }
                    if (!(id instanceof ProjectComponentIdentifier)) {
                        throw new GradleException("Unmapped runtime component: ${name}")
                    }
                    return null
                }.findAll { it != null }.unique().sort { a, b ->
                    "${a.group}:${a.name}:${a.version}" <=> "${b.group}:${b.name}:${b.version}"
                }
                // Resolve artifacts too: missing JAR/AAR files and opaque local
                // file dependencies must not disappear from a successful scan.
                configuration.incoming.artifacts.artifacts.each { artifact ->
                    def id = artifact.id.componentIdentifier
                    if (!(id instanceof ModuleComponentIdentifier) && !(id instanceof ProjectComponentIdentifier)) {
                        throw new GradleException("Unmapped runtime artifact: ${name}")
                    }
                }
                if (modules.isEmpty()) throw new GradleException("Empty runtime graph: ${name}")
                configurations[name] = modules
            }
            def report = [schema: 1, gradleVersion: gradle.gradleVersion,
                          javaVersion: System.getProperty('java.version'), configurations: configurations]
            def target = new File(output.toString())
            target.parentFile.mkdirs()
            target.setText(JsonOutput.prettyPrint(JsonOutput.toJson(report)) + '\n', 'UTF-8')
        }
    }
}
