; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[sim_base]
platform = native
build_type = release
lib_deps = lvgl/lvgl@^9.2.0
lib_ldf_mode = deep
build_flags = 
	-std=gnu++17
	-I ${PROJECT_DIR}/shims
	-I ${PROJECT_DIR}/../src
	-DLV_CONF_INCLUDE_SIMPLE
	-DSIM_HOST=1
	-DARDUINO=10819
; Every env compiles exactly one render tree: fw/ (LVGL terrarium+HUD),
; mtx/ (TC001 matrix), eink/ (InkDeck), knob/ (T-Embed) or ticker/
; (T-Display-S3-Pro). Adding a tree means excluding it here and including it
; in its own env — a tree left in the default filter fails to link everywhere
; else, since its board-specific #if wraps the whole file to nothing.
build_src_filter = +<*> -<mtx/> -<eink/> -<knob/> -<ticker/>

[env:box_86]
extends = sim_base
build_flags = 
	${sim_base.build_flags}
	-DBOARD_BOX_86
	-DSCREEN_W=480
	-DSCREEN_H=480

[env:ips35]
extends = sim_base
build_flags = 
	${sim_base.build_flags}
	-DBOARD_IPS35
	-DSCREEN_W=480
	-DSCREEN_H=320

[env:amoled]
extends = sim_base
build_flags = 
	${sim_base.build_flags}
	-DBOARD_AMOLED
	-DIS_ROUND=1
	-DSCREEN_W=360
	-DSCREEN_H=360

[env:ttgo]
extends = sim_base
build_flags = 
	${sim_base.build_flags}
	-DBOARD_TTGO
	-DSCREEN_W=135
	-DSCREEN_H=240

[env:ips10]
extends = sim_base
build_flags = 
	${sim_base.build_flags}
	-DBOARD_IPS10
	-DSCREEN_W=1280
	-DSCREEN_H=800

; LilyGO T-Embed CC1101 "Companion Knob" — 320×170 ST7789, encoder-driven
; two-level session UI (ui/knob/). No terrarium: the knob tree is the screen.
[env:t_embed]
extends = sim_base
build_src_filter = +<*> -<fw/> -<mtx/> -<eink/> -<ticker/>
build_flags =
	${sim_base.build_flags}
	-DBOARD_T_EMBED
	-DSCREEN_W=320
	-DSCREEN_H=170

; LilyGO T-Display-S3-Pro "Focus Strip" — 480×222 ST7796U desk strip
; (ui/ticker/). Pages: focus, usage, sessions.
[env:t_display_pro]
extends = sim_base
build_src_filter = +<*> -<fw/> -<mtx/> -<eink/> -<knob/>
build_flags =
	${sim_base.build_flags}
	-DBOARD_T_DISPLAY_PRO
	-DSCREEN_W=480
	-DSCREEN_H=222

[env:led8x32]
extends = sim_base
build_src_filter = +<*> -<fw/> -<eink/> -<knob/> -<ticker/> -<fonts/> -<sim_display.cpp>
build_flags =
	${sim_base.build_flags}
	-DBOARD_LED8X32

; Seeed InkDeck 7.5" 800×480 1-bit e-ink (UC8179). Direct-draw GxEPD2 tree — the
; geometry/text come from the real vendored Adafruit_GFX; only drawPixel + the
; panel lifecycle are shimmed. No LVGL (sim_display.cpp excluded), no terrarium.
[env:inkdeck]
extends = sim_base
build_src_filter = +<*> -<fw/> -<mtx/> -<knob/> -<ticker/> -<fonts/> -<sim_display.cpp>
build_flags =
	${sim_base.build_flags}
	-I ${PROJECT_DIR}/vendor/adafruit_gfx
	-DBOARD_INKDECK
	-DSCREEN_W=800
	-DSCREEN_H=480

; XTeink X3 / X4 layout previews. AgentDeck neither builds nor flashes these
; readers — they run the community CrossPoint fork, whose GfxRenderer draws the
; final glyphs. What IS shared, byte-identically, is the responsive geometry
; SSOT (ui/eink/eink_dashboard_layout.h, mirrored by
; scripts/sync-xteink-eink-dashboard.sh), so these envs render the AgentDeck
; e-ink tree at each panel's real dimensions to show the composition the fork
; lays out. Label the output a layout preview, never a firmware frame. X3's
; 528px short edge is also the only Regular-density case any render exercises.
[env:xteink_x3]
extends = env:inkdeck
build_flags =
	${sim_base.build_flags}
	-I ${PROJECT_DIR}/vendor/adafruit_gfx
	-DBOARD_INKDECK
	-DSCREEN_W=528
	-DSCREEN_H=792

[env:xteink_x4]
extends = env:inkdeck
build_flags =
	${sim_base.build_flags}
	-I ${PROJECT_DIR}/vendor/adafruit_gfx
	-DBOARD_INKDECK
	-DSCREEN_W=480
	-DSCREEN_H=800
