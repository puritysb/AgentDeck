[env:ips10]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
; Root fix for the hosted-C6 reboot asserts (sdio_rx_get_buffer /
; sdio_push_data_to_queue): the prebuilt Arduino libs bake in
; SDIO_OPTIMIZATION_RX_STREAMING_MODE, which services a coalesced RX burst
; with ONE contiguous internal-DMA allocation — and this firmware's internal
; heap fragments to a ~31 KB largest block within minutes (74 KB free total),
; so a big burst asserts and reboots the board. pioarduino's custom_sdkconfig
; recompiles the core with the delta below: per-packet RX buffers are ~1.6 KB
; each, which a fragmented heap always satisfies. Throughput cost is
; irrelevant at this board's traffic levels.
; The one-flag root fix: the hosted transport's mempool (whose exhaustion is
; exactly what asserts and reboots this board — sdio_rx_get_buffer /
; sdio_push_data_to_queue) draws from PSRAM instead of the ~80 KB contended
; internal heap. RX stays in stock STREAMING mode: its big coalesced-burst
; allocation is harmless against 32 MB of PSRAM, while flipping to RX_NONE
; was measured to pin ~70 KB of internal heap in retained per-packet pool
; buffers (free collapsed 82→10 KB).
; Mechanics gotchas, each paid for: choices must be defeated with `=n`, not
; "# ... is not set" (the ini parser eats those as comments);
; board_upload.flash_size feeds the espidf-side flash geometry (else 4MB and
; the 16MB OTA table is rejected); and the generated esp32/sdkconfig.defaults
; + sdkconfig.ips10 are build artifacts — delete both when changing deltas,
; or the stale per-env sdkconfig keeps winning.
board_upload.flash_size = 16MB
custom_sdkconfig =
	CONFIG_ESP_HOSTED_MEMPOOL_PREFER_SPIRAM=y
board = esp32-p4
upload_port = /dev/cu.wchusbserial10
upload_speed = 115200
monitor_port = /dev/cu.wchusbserial10
monitor_speed = 115200
upload_flags =
	--before=no_reset
	--after=no_reset
	--no-stub
board_build.flash_size = 16MB
board_build.flash_mode = dio
; The L suffix matters under custom_sdkconfig: the espidf-side flag generator
; strips "000000L" to derive MHz, so a bare 40000000 becomes an invalid
; FLASHFREQ of "40000000m" in the recompiled core's sdkconfig.
board_build.f_flash = 40000000L
board_build.arduino.memory_type = qio_qspi
board_build.partitions = partitions/jc8012p4a1c_ota.csv
build_src_filter =
	+<*>
	-<ui/matrix/*>
lib_deps =
	lvgl/lvgl@^9.2.0
	links2004/WebSockets@^2.6.1
	bblanchon/ArduinoJson@^7.3.0
	tzapu/WiFiManager@^2.0.17
lib_ldf_mode = deep
build_flags =
	-DCORE_DEBUG_LEVEL=3
	-DBOARD_IPS10
	-DBOARD_HAS_PSRAM
	-DSCREEN_W=800
	-DSCREEN_H=1280
	-DLV_CONF_INCLUDE_SIMPLE
	-DLV_LVGL_H_INCLUDE_SIMPLE
	-DCONFIG_ESP32_PHY_MAX_WIFI_TX_POWER=20
	-DHAS_OTA=1
	-I src
