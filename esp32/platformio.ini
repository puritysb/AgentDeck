; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = box_86
boards_dir = boards

; Pin pioarduino in each environment: moving stable now requires Core >=6.2.0,
; while the release-tested Core 6.1.19 uses platform 55.03.311 (esp32-v1.3.0 CI run 34753627616).
[env]
platform = espressif32@^6.9.0
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; Inject GIT_SHA / BUILD_EPOCH macros so device_info can report the exact build.
extra_scripts = pre:scripts/git_rev.py
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.f_cpu = 240000000L
build_flags =
	-DCORE_DEBUG_LEVEL=3
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_MODE=1
	-DLV_CONF_INCLUDE_SIMPLE
	-DLV_LVGL_H_INCLUDE_SIMPLE
	-I src
lib_deps =
	lvgl/lvgl@^9.2.0
	lovyan03/LovyanGFX@^1.2.0
	links2004/WebSockets@^2.6.1
	bblanchon/ArduinoJson@^7.3.0
	tzapu/WiFiManager@^2.0.17
lib_ldf_mode = deep

