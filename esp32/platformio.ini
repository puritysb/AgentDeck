[env:trmnl_75]
; TRMNL 7.5" — Seeed TRMNL 7.5" OG DIY Kit: XIAO ESP32-S3 Plus (16MB flash /
; 8MB octal PSRAM) + GDEY075T7 800×480 1-bit e-ink (UC8179). Always
; USB-powered; connects to the daemon over WiFi WS (mDNS discovery) like
; every other board, with USB serial as the provisioning/identify path.
; Direct-draw GxEPD2 render tree (ui/eink/) — no LVGL, no matrix.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
board = seeed_xiao_esp32s3
# seeed_xiao_esp32s3 BSP is 8MB-flash (default_8MB.csv / upload.flash_size=8MB).
# The XIAO ESP32-S3 Plus chip is physically 16MB, but the BSP bakes an 8MB
# bootloader flash-size field, so a 16MB partition table is rejected by the
# 2nd-stage bootloader ("partition ... exceeds flash chip size 0x800000").
# Keep flash_size + partitions consistent at 8MB (firmware fits in app0 3.3MB).
board_build.flash_size = 8MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_8MB.csv
build_src_filter =
	+<*>
	-<ui/display.*>
	-<ui/screens/*>
	-<ui/terrarium/*>
	-<ui/widgets/*>
	-<ui/fonts/*>
	-<ui/panel_st77916.h>
	-<ui/assets/*>
	-<ui/matrix/*>
	-<audio/*>
	+<ui/eink/*>
lib_deps =
	zinggjm/GxEPD2@^1.6.4
	adafruit/Adafruit GFX Library@^1.11.9
	adafruit/Adafruit BusIO@^1.16.1
	olikraus/U8g2_for_Adafruit_GFX@^1.8.0
	links2004/WebSockets@^2.6.1
	bblanchon/ArduinoJson@^7.3.0
	tzapu/WiFiManager@^2.0.17
lib_ldf_mode = deep
build_flags =
	-DCORE_DEBUG_LEVEL=3
	-DBOARD_HAS_PSRAM
	-DBOARD_TRMNL_75
	-DBOARD_EINK_SURFACE
	-DSCREEN_W=800
	-DSCREEN_H=480
	; TinyUSB CDC (USB-OTG), NOT the ROM USB-Serial/JTAG (HWCDC): the HWCDC
	; driver on this core measurably drops whole 64-byte FIFO blocks in BOTH
	; directions under full-duplex protocol traffic (mangled device_info out,
	; truncated sessions_list in → IncompleteInput → empty session grid).
	-DARDUINO_USB_MODE=0
	-DARDUINO_USB_CDC_ON_BOOT=1
	-I src

