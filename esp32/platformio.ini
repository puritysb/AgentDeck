	-DHAS_OTA=1
; No `--before=no_reset`: this board's native USB CDC needs esptool's normal
; reset-into-bootloader sequence. Copying the no_reset/no-stub flags from the
; CH340 envs made every USB upload fail with "chip stopped responding" once the
; firmware got busy (2026-07-26); a plain `--before default_reset` write worked
; first try. Serial-attached boards also cannot take WiFi OTA (the firmware
; parks the radio while the daemon drives it over USB), so USB is the only path
; when the daemon holds the port — it has to work.

