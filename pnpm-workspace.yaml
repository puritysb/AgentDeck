packages:
  - shared
  - bridge
  - plugin
  - plugin-ulanzi
  - hooks
  - setup
  - services/dot-relay

# Fail development installs on EOL or short-lived odd Node releases. Native
# prebuild coverage is a product contract, not an advisory: CI verifies every
# supported even line below.
engineStrict: true

allowBuilds:
  better-sqlite3: true
  node-pty: true
  sharp: true
  '@resvg/resvg-js': true
  # serialport ships prebuilt bindings (node-gyp-build) and enumerates/opens
  # ports fine without running its build script — verified 2026-08-22 against
  # the real fleet. esbuild is already declined in ignoredBuiltDependencies.
  '@serialport/bindings-cpp': false
  # esbuild arrives via tsx. Its install script only fetches the platform
  # binary, which pnpm already provides as @esbuild/darwin-arm64 — every tsx run
  # in this repo worked with the script declined. Also listed in
  # ignoredBuiltDependencies below; pnpm 11 wants the explicit decision here.
  esbuild: false

ignoredBuiltDependencies:
  - esbuild

# Security overrides are scoped and backed by consumer/API regression checks.
# Elgato imports zod/v4-mini; the SDK peers support v4 and JSON-schema tooling
# imports the preserved zod/v3 entry point. Do not broaden these selectors.
overrides:
  fast-uri@3: 3.1.9
  brace-expansion@1: 1.1.21
  brace-expansion@2: 2.1.7
  brace-expansion@5: 5.0.12
  tar@7: 7.5.21
  moment@2: 2.31.0
  '@elgato/utils>zod': 4.6.6
  '@anthropic-ai/sdk>zod': 4.6.6
  '@modelcontextprotocol/sdk>zod': 4.6.6
  'zod-to-json-schema>zod': 4.6.6
  'stream-json@3': 3.8.0
  'glob@7': 14.0.3
  'glob@13': 14.0.3
  'minimatch@10': 11.0.4
  'ejs>jake': 13.0.3
  'filelist>minimatch': 11.0.4
  # The resolver patch uses Node's structuredClone for its static DEFAULTS copy.
  # Remove only this reviewed consumer's now-unused dependency.
  '@rollup/plugin-node-resolve@16.0.3>deepmerge': '-'

patchedDependencies:
  '@rollup/plugin-node-resolve@16.0.3': patches/@rollup__plugin-node-resolve@16.0.3.patch
