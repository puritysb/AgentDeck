name: AgentDeck
configs:
  CloudKitPoCDebug: debug
  Debug: debug
  Release: release
  DotPreviewDebug: debug
  DotPreviewRelease: release
options:
  defaultConfig: Debug
  bundleIdPrefix: bound.serendipity.agent.deck
  deploymentTarget:
    iOS: "17.0"
    macOS: "26.0"
    watchOS: "10.0"
  xcodeVersion: "26.6"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    AGENTDECK_CLOUDKIT_CONDITION: ""
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "2.1.1"
    SWIFT_INCLUDE_PATHS: "$(inherited) $(PROJECT_DIR)/../shared/glance-raster/include"
    CURRENT_PROJECT_VERSION: 5
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # Dot is an explicitly selected development feature, never a runtime switch.
    AGENTDECK_DOT_CONDITION: ""
    AGENTDECK_DOT_SUPPORT: excluded
    EXCLUDED_SOURCE_FILE_NAMES: "$(inherited) Dot*.swift dot-mcp-contract.json"
  configs:
    CloudKitPoCDebug:
      AGENTDECK_CLOUDKIT_CONDITION: AGENTDECK_CLOUDKIT_POC
    DotPreviewDebug:
      AGENTDECK_DOT_CONDITION: AGENTDECK_DOT_PREVIEW
      AGENTDECK_DOT_SUPPORT: preview
      EXCLUDED_SOURCE_FILE_NAMES: ""
    DotPreviewRelease:
      AGENTDECK_DOT_CONDITION: AGENTDECK_DOT_PREVIEW
      AGENTDECK_DOT_SUPPORT: preview
      EXCLUDED_SOURCE_FILE_NAMES: ""
      # Optimized development builds also run the @testable XCTest suite.
      ENABLE_TESTABILITY: YES

targets:
  AgentDeck_iOS:
    type: application
    platform: iOS
    productName: AgentDeck
    sources:
      - path: AgentDeck
        excludes:
          - Resources/Info.plist
          - Resources/Info-macOS.plist
          - Resources/OpenCodeObserver.json
      - path: ../generated/protocol/AgentCommand.swift
        group: AgentDeck/Generated
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: bound.serendipity.agent.deck
        INFOPLIST_FILE: AgentDeck/Resources/Info.plist
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        PRODUCT_NAME: AgentDeck
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: true
        DEVELOPMENT_TEAM: QF36NDHYHD
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(AGENTDECK_DOT_CONDITION) $(AGENTDECK_CLOUDKIT_CONDITION)"
      configs:
        CloudKitPoCDebug:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_ENTITLEMENTS: AgentDeck/Resources/CloudKitPoC-iOS.entitlements
        debug:
          CODE_SIGN_STYLE: Automatic
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG $(AGENTDECK_DOT_CONDITION) $(AGENTDECK_CLOUDKIT_CONDITION)"
        release:
          # Release archives use one persistent organization Distribution
          # identity. Automatic signing on an ephemeral CI runner creates a
          # fresh Development certificate per job and exhausts Apple's cap.
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: AgentDeck Dashboard AppStore

  AgentDeck_macOS:
    type: application
    platform: macOS
    productName: AgentDeck
    sources:
      - path: AgentDeck
        excludes:
          - Resources/Info.plist
          - Resources/Info-macOS.plist
      - path: ../generated/protocol/AgentCommand.swift
        group: AgentDeck/Generated
      - path: ../generated/protocol/GatewayFrame.swift
        group: AgentDeck/Generated
      - path: ../bridge/assets/fonts/IBMPlexSans-Regular.ttf
        buildPhase: resources
      - path: ../bridge/assets/fonts/IBMPlexSans-Bold.ttf
        buildPhase: resources
      - path: ../bridge/assets/fonts/JetBrainsMono-Regular.ttf
        buildPhase: resources
      - path: ../bridge/assets/fonts/JetBrainsMono-Bold.ttf
        buildPhase: resources
      - path: ../bridge/assets/fonts/IBMPlexSansKR-Regular.ttf
        buildPhase: resources
      - path: ../bridge/assets/fonts/IBMPlexSansKR-Bold.ttf
        buildPhase: resources
      - path: ../bridge/assets/fonts/IBMPlexSansJP-Regular.ttf
        buildPhase: resources
      - path: ../bridge/assets/fonts/IBMPlexSansJP-Bold.ttf
        buildPhase: resources
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: AgentDeck/Resources/AgentDeck.entitlements
        LIBRARY_SEARCH_PATHS: "$(inherited) $(BUILT_PRODUCTS_DIR)"
        OTHER_LDFLAGS: "$(inherited) -lagentdeck_glance_raster -liconv -framework Security"
        PRODUCT_BUNDLE_IDENTIFIER: bound.serendipity.agent.deck
        INFOPLIST_FILE: AgentDeck/Resources/Info-macOS.plist
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        PRODUCT_NAME: AgentDeck
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: true
        DEVELOPMENT_TEAM: QF36NDHYHD
        # App Store invariant token. macOS is shipped as an App Store app
        # only; full-spec developer integrations live in the external Node
        # CLI/daemon. Do not use this as a distribution switch or reintroduce
        # subprocess/bundled-helper paths under another condition.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "AGENTDECK_APP_STORE $(AGENTDECK_DOT_CONDITION) $(AGENTDECK_CLOUDKIT_CONDITION)"
      configs:
        CloudKitPoCDebug:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_ENTITLEMENTS: AgentDeck/Resources/CloudKitPoC-macOS.entitlements
        debug:
          CODE_SIGN_STYLE: Automatic
          # Setting the base condition above REPLACES Xcode's per-config
          # default, so a Debug macOS build had no `DEBUG` flag and every
          # `#if DEBUG` block compiled out — including the
          # `-AgentDeckScreenshotURL` launch pin the recording runbook
          # depends on. Re-add it for Debug only; Release keeps the App
          # Store token alone, so debug-only paths still never ship.
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "AGENTDECK_APP_STORE DEBUG $(AGENTDECK_DOT_CONDITION) $(AGENTDECK_CLOUDKIT_CONDITION)"
        release:
          # Persistent manual signing — see the iOS release config note.
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: AgentDeck Dashboard macOS AppStore
    preBuildScripts:
      - name: "Build Glance static rasterizer"
        script: '"${PROJECT_DIR}/scripts/build-glance-raster.sh"'
        basedOnDependencyAnalysis: false
    postCompileScripts:
      - name: "App Store Helper Guard"
        script: |
          "${PROJECT_DIR}/scripts/copy-adb.sh"
        basedOnDependencyAnalysis: false

  AgentDeckTests_iOS:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AgentDeckTests
    dependencies:
      - target: AgentDeck_iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: bound.serendipity.agent.deck.tests
        DEVELOPMENT_TEAM: QF36NDHYHD
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/AgentDeck.app/AgentDeck"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(AGENTDECK_DOT_CONDITION) $(AGENTDECK_CLOUDKIT_CONDITION)"
      configs:
        debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG $(AGENTDECK_DOT_CONDITION) $(AGENTDECK_CLOUDKIT_CONDITION)"

  AgentDeckTests_macOS:
    type: bundle.unit-test
    platform: macOS
    sources:
      - AgentDeckTests
    dependencies:
      - target: AgentDeck_macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: bound.serendipity.agent.deck.tests
        CODE_SIGN_IDENTITY: Apple Development
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: QF36NDHYHD
        PROVISIONING_PROFILE_SPECIFIER: ""
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/AgentDeck.app/Contents/MacOS/AgentDeck"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
        # Match the host app's compile flag so tests evaluate the same
        # `#if AGENTDECK_APP_STORE` blocks. Without this the test target
        # would reference symbols the host compiled out (e.g. the
        # `.bundledBridge` launch mode fallback) and fail at link or run.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "AGENTDECK_APP_STORE $(AGENTDECK_DOT_CONDITION) $(AGENTDECK_CLOUDKIT_CONDITION)"
      configs:
        debug:
          # Keep in step with the host app's Debug conditions above.
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "AGENTDECK_APP_STORE DEBUG $(AGENTDECK_DOT_CONDITION) $(AGENTDECK_CLOUDKIT_CONDITION)"

  # Development-only Watch reader for the CloudKit remote-observation PoC
  # (docs/apple-remote-observation.md). Not embedded in the iOS app and not
  # part of any App Store archive; installed from Xcode onto a paired Watch.
  # It reads the private CloudKit summary directly, so it builds the PoC
  # sources under AGENTDECK_CLOUDKIT_POC in every configuration.
  AgentDeck_watchOS:
    type: application
    platform: watchOS
    productName: AgentDeck
    sources:
      - path: AgentDeckWatch
      - path: AgentDeck/RemoteObservation/WatchObservationModel.swift
      - path: AgentDeck/RemoteObservation/RemoteObservationProjection.swift
      - path: AgentDeck/RemoteObservation/RemoteObservationPersistence.swift
      - path: AgentDeck/RemoteObservation/CloudKitObservationStore.swift
      - path: AgentDeck/RemoteObservation/RemoteGlance.swift
      - path: AgentDeck/UI/Common/DesignTokens.swift
    dependencies:
      - target: AgentDeckWatchWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: bound.serendipity.agent.deck.watchkitapp
        PRODUCT_NAME: AgentDeck
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: AgentDeck
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: bound.serendipity.agent.deck
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: AgentDeckWatch/Resources/AgentDeckWatch.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: QF36NDHYHD
        ENABLE_PREVIEWS: true
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "AGENTDECK_CLOUDKIT_POC"
      configs:
        debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG AGENTDECK_CLOUDKIT_POC"

  AgentDeckWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: AgentDeckWatchWidgets
        excludes:
          - Resources/Info.plist
      - path: AgentDeckWatch/Shared
      - path: AgentDeck/RemoteObservation/RemoteObservationProjection.swift
      - path: AgentDeck/RemoteObservation/RemoteObservationPersistence.swift
      - path: AgentDeck/RemoteObservation/CloudKitObservationStore.swift
      - path: AgentDeck/RemoteObservation/RemoteGlance.swift
      - path: AgentDeck/UI/Common/DesignTokens.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: bound.serendipity.agent.deck.watchkitapp.widgets
        PRODUCT_NAME: AgentDeckWatchWidgets
        INFOPLIST_FILE: AgentDeckWatchWidgets/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: AgentDeckWatchWidgets/Resources/AgentDeckWatchWidgets.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: QF36NDHYHD
        SKIP_INSTALL: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "AGENTDECK_CLOUDKIT_POC"
      configs:
        debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG AGENTDECK_CLOUDKIT_POC"

schemes:
  AgentDeck_iOS:
    build:
      targets:
        AgentDeck_iOS: all
        AgentDeckTests_iOS: [test]
    test:
      gatherCoverageData: true
      targets:
        - AgentDeckTests_iOS
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  AgentDeck_macOS:
    build:
      targets:
        AgentDeck_macOS: all
        AgentDeckTests_macOS: [test]
    test:
      gatherCoverageData: true
      targets:
        - AgentDeckTests_macOS
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  AgentDeck_DotPreview_iOS:
    build:
      targets:
        AgentDeck_iOS: all
        AgentDeckTests_iOS: [test]
    test:
      config: DotPreviewDebug
      gatherCoverageData: true
      targets:
        - AgentDeckTests_iOS
    run:
      config: DotPreviewDebug
    profile:
      config: DotPreviewRelease
    analyze:
      config: DotPreviewDebug
    archive:
      config: DotPreviewRelease

  AgentDeck_DotPreview_macOS:
    build:
      targets:
        AgentDeck_macOS: all
        AgentDeckTests_macOS: [test]
    test:
      config: DotPreviewDebug
      gatherCoverageData: true
      targets:
        - AgentDeckTests_macOS
    run:
      config: DotPreviewDebug
    profile:
      config: DotPreviewRelease
    analyze:
      config: DotPreviewDebug
    archive:
      config: DotPreviewRelease

  AgentDeck_CloudKitPoC_iOS:
    build:
      targets:
        AgentDeck_iOS: all
        AgentDeckTests_iOS: [test]
    test:
      config: CloudKitPoCDebug
      targets:
        - AgentDeckTests_iOS
    run:
      config: CloudKitPoCDebug

  AgentDeck_CloudKitPoC_macOS:
    build:
      targets:
        AgentDeck_macOS: all
        AgentDeckTests_macOS: [test]
    test:
      config: CloudKitPoCDebug
      targets:
        - AgentDeckTests_macOS
    run:
      config: CloudKitPoCDebug

  AgentDeck_CloudKitPoC_watchOS:
    build:
      targets:
        AgentDeck_watchOS: all
    run:
      config: CloudKitPoCDebug
